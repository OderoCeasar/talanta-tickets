version: "2"
sql:
  - engine: postgresql
    # sqlc reads golang-migrate files directly and skips the .down.sql ones.
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_interface: false
        emit_json_tags: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # Required timestamps as time.Time; nullable ones become *time.Time through
          # emit_pointers_for_null_types.
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type:
              import: encoding/json
              type: RawMessage
