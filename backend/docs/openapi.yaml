      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplate' }
            example: { name: League match, event_id: 1 }
      responses:
        '201':
          description: The saved template.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Template' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` - no such venue or event.'
          content: *err
        '409':
          description: '`ALREADY_EXISTS` - the venue already has a template with this name.'
          content: *err
        '422':
          description: '`VENUE_MISMATCH` - the event is at a different venue.'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/venues/{venueId}/templates/{templateId}:
    delete:
      operationId: deleteVenueTemplate
      tags: [AdminVenues]
      summary: Delete a saved template
      description: |
        **Role:** ORGANISER, ADMIN. Removes the template. Events that were created from it
        keep their categories and painting: those were copied when the event was made.
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/TemplateId'
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` - no such template at this venue (or no such venue).'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Admin: events
  # ---------------------------------------------------------------------------
  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [AdminEvents]
      summary: Events in every status
      description: '**Role:** ORGANISER, ADMIN. Ordered by kickoff, latest first. `seats_available` and `price_from_cents` in this list may be up to 20 seconds old; one event read on its own lags by a few seconds at most.'
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EventStatus' }
        - name: from
          in: query
          description: Kickoff at or after this time.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Kickoff before this time.
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      operationId: createEvent
      tags: [AdminEvents]
      summary: Create a draft event
      description: |
        **Role:** ORGANISER, ADMIN. The event starts in `DRAFT`. With `template_id` the
        template's categories and block/row assignments are copied onto it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEvent' }
            example:
              venue_id: 1
              title: Harambee Stars vs Uganda Cranes
              competition: AFCON Qualifier
              home_team: Harambee Stars
              away_team: Uganda Cranes
              kickoff_at: '2026-11-14T13:00:00Z'
              gates_open_at: '2026-11-14T10:00:00Z'
              sales_open_at: '2026-10-20T06:00:00Z'
              sales_close_at: '2026-11-14T12:00:00Z'
              max_tickets_per_user: 6
              template_id: 2
      responses:
        '201':
          description: The new event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` - no such venue or template.'
          content: *err
        '422':
          description: '`VENUE_MISMATCH` - the template belongs to a different venue.'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/events/{eventId}:
    get:
      operationId: getAdminEvent
      tags: [AdminEvents]
      summary: One event, any status
      description: '**Role:** ORGANISER, ADMIN.'
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      operationId: updateEvent
      tags: [AdminEvents]
      summary: Edit an event's details
      description: |
        **Role:** ORGANISER, ADMIN. Send only the fields to change; a nullable field is
        cleared by sending null. Status is not edited here: use `publish` and `cancel`.
        `CANCELLED` and `COMPLETED` events cannot be edited. The times must still make
        sense together after the change (gates before kickoff, sales closing after they
        open and not after kickoff), otherwise 400.

        Once the event has left `DRAFT` the change must also keep what publishing
        checked: `sales_open_at` and `sales_close_at` cannot be cleared (400, rule
        `required`) and `kickoff_at` cannot be moved to a time that has already passed
        (400, rule `future`). An event whose kickoff has simply gone by can still have
        its other fields edited.
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEvent' }
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `EVENT_NOT_EDITABLE` - the event is `CANCELLED` or `COMPLETED`.
            - `EVENT_BUSY` - the event is locked by a publish, a cancel or another edit that did not finish within a few seconds. Nothing changed; send the same request again in a moment.
          content: *err
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      operationId: deleteEvent
      tags: [AdminEvents]
      summary: Delete a draft event
      description: |
        **Role:** ORGANISER, ADMIN. Removes a `DRAFT` event with its categories and its
        painting. Only a draft can be deleted: once published an event has inventory and
        may have sales, so it is cancelled instead (409 `EVENT_NOT_EDITABLE`,
        `details.current_status` says where it is; a draft that was cancelled is
        `CANCELLED` and stays). Venue templates saved from the event are copies and are
        not touched. Deleting an event that is already gone answers 404.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `EVENT_NOT_EDITABLE` - the event is not `DRAFT`.
            - `EVENT_BUSY` - the event is locked by a publish, a cancel or another edit that did not finish within a few seconds. Nothing changed; send the same request again in a moment.
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/events/{eventId}/readiness:
    get:
      operationId: getEventReadiness
      tags: [AdminEvents]
      summary: Can this event be published, and if not, what is missing
      description: |
        **Role:** ORGANISER, ADMIN. An event is ready when every active seat has a
        category, every category has a price above zero, and the sales window is set and
        sensible. `problems` is empty exactly when `ready` is true.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The readiness report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
              example:
                event_id: 1
                event_status: DRAFT
                ready: false
                seat_total: 60000
                seats_with_category: 59520
                problems:
                  - code: SEATS_WITHOUT_CATEGORY
                    message: Block N12 has 480 seats with no category.
                    block_id: 112
                    block_code: N12
                    category_id: null
                    category_name: null
                    seat_count: 480
                  - code: CATEGORY_WITHOUT_PRICE
                    message: Category Terrace has no price.
                    block_id: null
                    block_code: null
                    category_id: 9
                    category_name: Terrace
                    seat_count: null
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/events/{eventId}/publish:
    post:
      operationId: publishEvent
      tags: [AdminEvents]
      summary: Publish an event and put its seats on sale
      description: |
        **Role:** ORGANISER, ADMIN. Creates one inventory row per active seat and moves the
        event from `DRAFT` to `ON_SALE` when now is inside `[sales_open_at, sales_close_at)`,
        otherwise to `PUBLISHED`. No request body.

        This is the one slow call in the API: for the full stadium it can take most of a
        minute, so give it a client timeout of 60 seconds. While it runs the event is
        locked: painting, category changes, edits of the event, cancel, a second publish
        and a fan's hold request wait a few seconds (5 for staff calls, 3 for holds) and
        are then answered 409 `EVENT_BUSY`, with nothing changed. Send them again once
        the publish has answered. Changing a block's `code` at the same venue is refused
        the same way; deleting or regenerating a block answers 409 `BLOCK_HAS_INVENTORY`.

        Safe to repeat: publishing an event that is already `PUBLISHED`, `ON_SALE` or
        `SOLD_OUT` changes nothing and answers 200 with `already_published: true`.

        If the event is not ready the answer is 409 `EVENT_NOT_READY` and
        `details.problems` is the same list as the readiness endpoint.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Published (now or earlier).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublishResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `EVENT_NOT_READY` - see `details.problems`.
            - `INVALID_STATE_TRANSITION` - the event is `CANCELLED` or `COMPLETED`.
            - `EVENT_BUSY` - the event is locked by a publish, a cancel or another edit that did not finish within a few seconds. Nothing changed; send the same request again in a moment. A second publish sent while the first is still running gets this.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: EVENT_NOT_READY
                  message: This event cannot be published yet. 1 thing is missing.
                  details:
                    problems:
                      - code: SALES_WINDOW_MISSING
                        message: Set when ticket sales open and close.
                        block_id: null
                        block_code: null
                        category_id: null
                        category_name: null
                        seat_count: null
        '500': { $ref: '#/components/responses/Internal' }

  /admin/events/{eventId}/cancel:
    post:
      operationId: cancelEvent
      tags: [AdminEvents]
      summary: Cancel an event, void its tickets and queue refunds
      description: |
        **Role:** ORGANISER, ADMIN. Moves the event to `CANCELLED`, releases every hold
        (the held seats go back to `AVAILABLE`), marks every `VALID` or `USED` ticket
        `VOID`, moves unpaid (`PENDING_PAYMENT`) bookings to `CANCELLED`, queues one refund
        per successful payment and moves `PAID` bookings to `REFUND_REQUIRED`, all in one
        transaction. A draft can be cancelled too. No request body. Safe to repeat:
        cancelling a `CANCELLED` event answers 200 with zero counts.

        On a sold-out stadium this rewrites about 60,000 seats, tickets and bookings and
        can take longer than an ordinary call, so it runs under the same longer time limit
        as publish: give it a client timeout of 60 seconds. While it runs the event is
        locked as it is during a publish (other calls answer 409 `EVENT_BUSY`).
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `INVALID_STATE_TRANSITION` - a `COMPLETED` event cannot be cancelled.
            - `EVENT_BUSY` - the event is locked by a publish, a cancel or another edit that did not finish within a few seconds. Nothing changed; send the same request again in a moment.
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/events/{eventId}/categories:
    get:
      operationId: listAdminEventCategories
      tags: [AdminEvents]
      summary: An event's categories, any event status
      description: '**Role:** ORGANISER, ADMIN. Not paged.'
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The categories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      operationId: createCategory
      tags: [AdminEvents]
      summary: Add a category to an event
      description: |
        **Role:** ORGANISER, ADMIN. The name is unique within the event. While the event is
        `DRAFT` a price of zero is accepted (it blocks publishing); once the event has left
        `DRAFT` the price must be above zero (400 on `price_cents`, rule `gt`).

        A price must be whole shillings (`price_cents` a multiple of 100): M-Pesa takes no
        cents. Anything else is refused with 400 on `price_cents`, rule `whole_shillings`.
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCategory' }
            example: { name: VIP, price_cents: 250000, color_hex: '#C9A227', description: 'West stand, padded seats' }
      responses:
        '201':
          description: The new category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `ALREADY_EXISTS` - name taken.
            - `EVENT_NOT_EDITABLE` - event is `CANCELLED` or `COMPLETED`.
            - `EVENT_BUSY` - the event is locked by a publish, a cancel or another edit that did not finish within a few seconds. Nothing changed; send the same request again in a moment.
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/categories/{categoryId}:
    patch:
      operationId: updateCategory
      tags: [AdminEvents]
      summary: Rename, recolour or reprice a category
      description: |
        **Role:** ORGANISER, ADMIN. Send only the fields to change.

        Changing `price_cents` once the event has left `DRAFT` needs `confirm: true`;
        without it the answer is 409 `CONFIRMATION_REQUIRED` and nothing changes. (Fans may
        already be looking at the old price; `details` says how many seats of the category
        are sold or held, which may be none.) Sending the price the category already has is
        not a change. Past bookings always keep the price they were made at.

        Once the event has left `DRAFT` the price must stay above zero: `price_cents: 0`
        is 400 on `price_cents` (rule `gt`), with or without `confirm`.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateCategory' }
            example: { price_cents: 300000, confirm: true }
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `CONFIRMATION_REQUIRED` - the event is published; resend with `confirm: true`. `details` has the sold and held counts.
            - `ALREADY_EXISTS` - name taken.
            - `EVENT_NOT_EDITABLE` - event is `CANCELLED` or `COMPLETED`.
            - `EVENT_BUSY` - the event is locked by a publish, a cancel or another edit that did not finish within a few seconds. Nothing changed; send the same request again in a moment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: CONFIRMATION_REQUIRED
                  message: 1,240 tickets are already sold or held in VIP. They keep the old price.
                  details: { sold: 1200, held: 40 }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      operationId: deleteCategory
      tags: [AdminEvents]
      summary: Delete a category
      description: |
        **Role:** ORGANISER, ADMIN. Removes the category and its block and row
        assignments. Refused once inventory or a booking points at it, which for a painted
        category means once the event is published.
      parameters:
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `CATEGORY_IN_USE` - the event has inventory or bookings in this category. `details.seats` is how many seats were published in it; `details.sold` and `details.held` how many of those are sold or held now. `seats` above zero with both others at zero means the only obstacle is that the event is published.
            - `EVENT_BUSY` - the event is locked by a publish, a cancel or another edit that did not finish within a few seconds. Nothing changed; send the same request again in a moment.
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/events/{eventId}/assignments:
    get:
      operationId: getEventAssignments
      tags: [AdminEvents]
      summary: Which category each block and row is painted with
      description: |
        **Role:** ORGANISER, ADMIN. A seat's category is its row's override if there is
        one, otherwise its block's. Blocks and rows with no entry are unpainted.
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The assignments.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignments' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/events/{eventId}/assign-category:
    post:
      operationId: assignCategory
      tags: [AdminEvents]
      summary: Paint blocks and rows with a category
      description: |
        **Role:** ORGANISER, ADMIN. Sets the category of every listed block and the
        override of every listed row in one transaction. `category_id: null` clears them
        instead. At least one of `block_ids` and `row_ids` must be non-empty.

        Only while the event is `DRAFT`: publish copies the painting into inventory.
      parameters:
        - $ref: '#/components/parameters/EventId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignCategory' }
            example: { category_id: 8, block_ids: [140, 141], row_ids: [] }
      responses:
        '200':
          description: The event's assignments after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Assignments' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` - no such event, or the category is not part of it.'
          content: *err
        '409':
          description: |
            - `EVENT_NOT_EDITABLE` - the event is no longer `DRAFT`.
            - `EVENT_BUSY` - the event is locked by a publish, a cancel or another edit that did not finish within a few seconds. Nothing changed; send the same request again in a moment.
          content: *err
        '422':
          description: '`VENUE_MISMATCH` - a block or row is not at the event''s venue; `details.fields` names them.'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Admin: sales
  # ---------------------------------------------------------------------------
  /admin/events/{eventId}/sales:
    get:
      operationId: getEventSales
      tags: [AdminSales]
      summary: Live sales figures for an event
      description: |
        **Role:** ORGANISER, ADMIN. One call feeds the whole dashboard: totals,
        per-category rows, a per-block heatmap, a time series of paid bookings and the
        count of bookings waiting for a refund. Cheap enough to poll every few seconds.

        Revenue counts `PAID` bookings only. Seat counts may lag by a few seconds, and a
        hold that has lapsed counts as available.

        Time-series buckets start on Africa/Nairobi clock boundaries: a `day` bucket runs
        from Nairobi midnight (21:00 UTC) to the next. `from` is inclusive, `to` exclusive;
        the first and last buckets only count what is inside the range.

        A call with no `bucket` and no `from` always succeeds, however long the event has
        been selling. When `bucket` is left out the server picks it: `hour` for a range of
        up to 48 hours, `day` beyond that; `series.bucket` says which. When `from` is left
        out the series starts at the first paid booking, or later if that would be more
        than 2,000 buckets: then it is the most recent 2,000. Only a `from` the caller
        sent can be too far back: more than 2,000 buckets is then 400 on `from`.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: bucket
          in: query
          description: 'Width of each time-series bucket. Left out: `hour` when the range is 48 hours or less, otherwise `day`.'
          schema: { $ref: '#/components/schemas/SalesBucket' }
        - name: from
          in: query
          description: Start of the time series. Left out, it is the first paid booking, moved forward if needed so that the series has at most 2,000 buckets.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: End of the time series. Defaults to now.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: The sales summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesSummary' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/events/{eventId}/bookings:
    get:
      operationId: listEventBookings
      tags: [AdminSales]
      summary: Bookings for an event
      description: |
        **Role:** ORGANISER, ADMIN. Newest first. `status=REFUND_REQUIRED` gives the list
        the dashboard pins to the top.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of bookings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBookingPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/alerts:
    get:
      operationId: listAlerts
      tags: [AdminSales]
      summary: Things an organiser has to act on
      description: '**Role:** ORGANISER, ADMIN. Newest first.'
      parameters:
        - name: event_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: acknowledged
          in: query
          description: '`false` for open alerts only, `true` for acknowledged only. Omit for both.'
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of alerts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/alerts/{alertId}/ack:
    post:
      operationId: ackAlert
      tags: [AdminSales]
      summary: Mark an alert as seen
      description: '**Role:** ORGANISER, ADMIN. No request body. Safe to repeat; the first acknowledgement time is kept.'
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/refunds:
    get:
      operationId: listRefunds
      tags: [AdminSales]
      summary: The refund queue
      description: |
        **Role:** ORGANISER, ADMIN. Oldest first, so the longest-waiting fan is on top.
        Refunds are paid by hand in the M-Pesa portal; this list is what to pay.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RefundStatus' }
        - name: event_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: booking_reference
          in: query
          description: Only the refunds of this booking. Lets an alert link to its refund.
          schema: { $ref: '#/components/schemas/BookingReference' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of refunds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/refunds/{refundId}/complete:
    post:
      operationId: completeRefund
      tags: [AdminSales]
      summary: Record that a refund was paid
      description: |
        **Role:** ORGANISER, ADMIN. No request body. Marks the refund `DONE`; when a
        `REFUND_REQUIRED` booking has no refund left pending it becomes `REFUNDED` and any
        ticket it still has is voided. A booking that is `PAID` (the refund was for a second,
        duplicate payment) stays `PAID` and keeps its tickets. Seats are not touched: see
        `docs/API_NOTES.md`. This records the fact, it does not move money.

        Safe to repeat: a refund that is already `DONE` answers 200 again with the first
        `completed_at`, and `already_completed: true` says this call changed nothing.

        The open `REFUND_REQUIRED` and `AMOUNT_MISMATCH` alerts about the refunded payment
        are closed in the same step, with a `resolution`.
      parameters:
        - $ref: '#/components/parameters/RefundId'
      responses:
        '200':
          description: The refund, with `already_completed`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`EVENT_BUSY` - a publish, a cancel or another edit has the event locked; nothing changed, send the request again.'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Admin: staff and invitations
  # ---------------------------------------------------------------------------
  /admin/users:
    get:
      operationId: listStaffUsers
      tags: [AdminUsers]
      summary: Staff accounts
      description: '**Role:** ADMIN. Users with role `ORGANISER` or `ADMIN`, by name.'
      parameters:
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/StaffRole' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of staff.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffUserPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/invitations:
    get:
      operationId: listInvitations
      tags: [AdminUsers]
      summary: Invitations sent
      description: '**Role:** ADMIN. Newest first. `invite_url` is always null here.'
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvitationStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of invitations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      operationId: createInvitation
      tags: [AdminUsers]
      summary: Invite a member of staff by email
      description: |
        **Role:** ADMIN. Emails the invitee a one-time link to set their password.

        `invite_url` in the answer contains the one-time token. It is returned **only**
        here and by `resend`, so the admin can copy the link when no mail provider is
        configured. Only a hash of the token is stored; the link cannot be shown again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitation' }
            example: { email: new.organiser@talanta.test, role: ORGANISER }
      responses:
        '201':
          description: The invitation, with its `invite_url`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
              example:
                id: 31
                email: new.organiser@talanta.test
                role: ORGANISER
                status: PENDING
                invited_by: { id: 2, name: Site Admin, email: admin@talanta.test }
                expires_at: '2026-10-18T09:00:00Z'
                created_at: '2026-10-11T09:00:00Z'
                accepted_at: null
                invite_url: https://talanta.vendorsoko.com/invite/4f9c0d6b1e7a43c2b8d5a1f0e3c7b9d24f9c0d6b1e7a43c2b8d5a1f0e3c7b9d2
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            - `EMAIL_ALREADY_REGISTERED` - a user with this email exists.
            - `INVITATION_ALREADY_PENDING` - an unexpired invitation for this email exists; resend or revoke it.
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/invitations/{invitationId}/resend:
    post:
      operationId: resendInvitation
      tags: [AdminUsers]
      summary: Send an invitation again with a new link
      description: |
        **Role:** ADMIN. No request body. Makes a new token and a new expiry; the old link
        stops working. Works on `PENDING` and `EXPIRED` invitations (an expired one becomes
        `PENDING` again). The answer carries the new `invite_url`.
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: The invitation, with its new `invite_url`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`INVITATION_NOT_PENDING` (already `ACCEPTED` or `REVOKED`) or `EMAIL_ALREADY_REGISTERED`.'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      tags: [AdminUsers]
      summary: Revoke an invitation
      description: '**Role:** ADMIN. The link stops working. Safe to repeat on a `REVOKED` invitation.'
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '204':
          description: Revoked (or already was).
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`INVITATION_NOT_PENDING` - it was already `ACCEPTED`; the account exists.'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Gate
  # ---------------------------------------------------------------------------
  /gate/events:
    get:
      operationId: listGateEvents
      tags: [Gate]
      summary: Events a gate device can scan for
      description: |
        **Role:** GATE_STAFF, ADMIN. Published events (`PUBLISHED`, `ON_SALE`, `SOLD_OUT`)
        whose kickoff is within the last 24 hours or still ahead, soonest first, each with
        its gate groups. Not paged; at most 50. A cancelled event is not listed, but its
        manifest still answers, so a device that already holds it hears that every ticket
        is void.
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateEventList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /gate/events/{eventId}/manifest:
    get:
      operationId: getGateManifest
      tags: [Gate]
      summary: Everything a device needs to check tickets offline
      description: |
        **Role:** GATE_STAFF, ADMIN. The Ed25519 public key(s), the event, and every
        ticket as a 3-item tuple `[ticket_id, gate_group_index, status_code]`.

        **Without `since`** (`full: true`): every ticket that is `VALID` or `USED`. The
        device replaces its stored set.

        **With `since=<version>`** (`full: false`): only tickets that changed after that
        version, in any status, including ones that became `VOID`. The device applies them
        on top of what it has: each tuple is that ticket's status now, so applying one
        twice is harmless. The server looks back two minutes before the version it is
        given, so a ticket that changed shortly before the last download is sent again;
        that is deliberate. If the version is unreadable, belongs to another event or is
        older than 7 days the server answers `full: true` instead; always check `full`.

        `version` is an opaque string. Store it together with the ticket set it came with
        and send back only that one. Send with `Accept-Encoding: gzip`; a full stadium is
        about 60,000 tuples (2.8 MB, 1.3 MB gzipped).

        `gate_group_index` points into the `gate_groups` array of the same answer. Store
        the gate group's text with each ticket, not the index.

        A draft event answers 404. A cancelled or finished event still answers.

        The private signing key is never in this or any other answer.
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: since
          in: query
          description: The `version` from the manifest the device already has.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: The manifest, full or changes only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GateManifest' }
              example:
                event:
                  id: 1
                  title: Harambee Stars vs Uganda Cranes
                  kickoff_at: '2026-11-14T13:00:00Z'
                  gates_open_at: '2026-11-14T10:00:00Z'
                  status: ON_SALE
                  venue_name: Talanta Stadium
                version: 'MTc2MDE3NzAwMDAwMDAwMA'
                full: true
                generated_at: '2026-10-11T10:30:00Z'
                keys:
                  - key_id: k1
                    algorithm: Ed25519
                    public_key: 11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo
                gate_groups: [N-LOWER, N-UPPER, W-LOWER]
                ticket_count: 3
                tickets:
                  - ['0b0f3a52-7c1e-4d7e-9a57-0c1b4d5e6f70', 0, V]
                  - ['5e2d9c1a-3b4f-4a6d-8e7f-1a2b3c4d5e6f', 0, U]
                  - ['c7a1e2f3-4b5c-4d6e-8f70-9a8b7c6d5e4f', 2, V]
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /gate/scans:
    post:
      operationId: uploadScans
      tags: [Gate]
      summary: Upload a batch of scans made at the gate
      description: |
        **Role:** GATE_STAFF, ADMIN. Up to 500 scans per call, from one device; more is
        413. Each scan carries a UUID made on the device (`client_scan_id`). A scan that
        was already uploaded is not stored again and is not judged again: the answer is
        the result the server holds for it now, so the device can resend a batch whenever
        it is unsure. Nothing about a stored scan is taken from the second upload.

        The server decides the final result of each new scan, which may differ from what
        the device showed offline. In this order, the first that applies:

        1. A `token` that fails signature checking, or is not the text issued for
           `ticket_id`: `INVALID`. A token for another event: `WRONG_EVENT`; for another
           gate group: `WRONG_GATE`.
        2. A ticket the server does not know: `INVALID` (the scan is still stored).
        3. A ticket of another event than the scan's `event_id`: `WRONG_EVENT`; of another
           gate group than the scan's `gate_group`: `WRONG_GATE`.
        4. A `VOID` or `TRANSFERRED` ticket: `INVALID`, also when it was scanned before it
           was voided.
        5. Otherwise, a scan the device did **not** report as `ADMITTED` keeps the device's
           result: the server never turns a refusal into an admission.
        6. Otherwise the scan is an admission. The admission of a ticket with the earliest
           `scanned_at` (ties: the smaller `client_scan_id`) is `ADMITTED` and the ticket
           is `USED`; every other admission of that ticket is `DUPLICATE`, whichever was
           uploaded first.

        `overridden` is true where the final result differs from the device's verdict:
        those are the scans this device lost.

        **A result can change after it was given.** If another device later uploads an
        earlier scan of the same ticket, that scan becomes `ADMITTED` and the one answered
        `ADMITTED` before becomes `DUPLICATE`. The first device is not told; it sees the
        change only if it uploads that scan again.

        `scanned_at` is the device's clock and is bounded: a time in the future, more than
        7 days old, or before the ticket was issued is replaced by the time the server
        received the batch.

        An `event_id` that does not exist is 400 for the whole batch. While an organiser
        is cancelling or editing the event the answer may be 409 `EVENT_BUSY`: nothing was
        stored, send the batch again.

        A QR that could not be read as a ticket ID at all is not uploaded.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScanBatch' }
            example:
              device_id: gate-phone-07
              scans:
                - client_scan_id: 6f1c2d3e-4a5b-4c6d-8e7f-809a1b2c3d4e
                  ticket_id: 0b0f3a52-7c1e-4d7e-9a57-0c1b4d5e6f70
                  event_id: 1
                  gate_group: N-LOWER
                  scanned_at: '2026-11-14T11:02:17Z'
                  result: ADMITTED
                  token: TLT1.AQABCw86UnweTX6aVwwbTV5vcAAAAAAAAAABTi1MT1dFUgAAAAAAAAAAAKGyw9Tl9gcY.O5024bVFl6fq-rPKjqJ15KNls5q3woLuzPEG33mc1oS0w-FSiCHxQXjhzotnEv0Wpfr78tSzzMR8KmOHMyk4Dg
                - client_scan_id: 7a2d3e4f-5b6c-4d7e-9f80-91ab2c3d4e5f
                  ticket_id: 5e2d9c1a-3b4f-4a6d-8e7f-1a2b3c4d5e6f
                  event_id: 1
                  gate_group: N-LOWER
                  scanned_at: '2026-11-14T11:02:41Z'
                  result: ADMITTED
      responses:
        '200':
          description: One result per uploaded scan, in the same order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanBatchResult' }
              example:
                results:
                  - client_scan_id: 6f1c2d3e-4a5b-4c6d-8e7f-809a1b2c3d4e
                    ticket_id: 0b0f3a52-7c1e-4d7e-9a57-0c1b4d5e6f70
                    result: ADMITTED
                    overridden: false
                    ticket_status: USED
                    first_admitted_at: '2026-11-14T11:02:17Z'
                  - client_scan_id: 7a2d3e4f-5b6c-4d7e-9f80-91ab2c3d4e5f
                    ticket_id: 5e2d9c1a-3b4f-4a6d-8e7f-1a2b3c4d5e6f
                    result: DUPLICATE
                    overridden: true
                    ticket_status: USED
                    first_admitted_at: '2026-11-14T10:58:03Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`EVENT_BUSY` - an event of the batch is being cancelled or edited. Nothing was stored; send the batch again.'
          content: *err
        '413':
          description: '`PAYLOAD_TOO_LARGE` - more than 500 scans, or a body over 1 MiB. Split the batch.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `access_token` from a sign-in or refresh. Lives 15 minutes.

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: { type: integer, minimum: 1 }

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    StandId:
      name: standId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    VenueId:
      name: venueId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    HoldId:
      name: holdId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    RefundId:
      name: refundId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    InvitationToken:
      name: token
      in: path
      required: true
      description: The one-time token from the invitation link.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{32,128}$' }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BookingReference:
      name: reference
      in: path
      required: true
      schema: { $ref: '#/components/schemas/BookingReference' }
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` from the previous page. Opaque.
      schema: { type: string, minLength: 1, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A value the client makes once per checkout (a UUID is ideal) and resends on every
        retry of the same request. Scoped to the signed-in user.
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      example: 3f6c1c0e-8a4b-4f0e-9b7e-2d1a5c6e7f80
    MockOutcome:
      name: X-Mock-Outcome
      in: header
      required: false
      description: |
        **Dev only.** Chooses what the mock payment provider does. Omitted means
        `success`. Refused with 403 `MOCK_NOT_ALLOWED` when `APP_ENV=production`.
      schema: { $ref: '#/components/schemas/MockOutcome' }

  responses:
    ValidationFailed:
      description: '`VALIDATION_FAILED` - the body, a query value or a path value is malformed. `details.fields` has one entry per bad field.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_FAILED
              message: Some fields are not valid.
              details:
                fields:
                  - { field: phone, rule: e164, message: 'Enter the phone number in international format, for example +254712345678.' }
    Unauthorized:
      description: '`UNAUTHENTICATED` (no token, or a bad one) or `TOKEN_EXPIRED` (refresh, then retry once).'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: TOKEN_EXPIRED, message: Your session has expired., details: null }
    Forbidden:
      description: '`FORBIDDEN` - signed in, but this role may not call this.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: FORBIDDEN, message: You do not have access to this., details: null }
    NotFound:
      description: '`NOT_FOUND` - no such thing, or it is not the caller''s to see.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: NOT_FOUND, message: We could not find that., details: null }
    TooManyRequests:
      description: '`RATE_LIMITED` - wait `Retry-After` seconds.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: RATE_LIMITED
              message: Too many requests. Try again in 30 seconds.
              details: { retry_after_seconds: 30 }
    Internal:
      description: '`INTERNAL` - a fault on our side. The message never carries internals; quote the `X-Request-Id` response header when reporting it.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: { code: INTERNAL, message: Something went wrong on our side., details: null }

  schemas:
    # -------------------------------------------------------------------------
    # Primitives and enums
    # -------------------------------------------------------------------------
    Id:
      type: integer
      format: int64
      minimum: 1
    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{7,14}$'
      description: Phone number in E.164 form.
      examples: ['+254712345678']
    Currency:
      type: string
      enum: [KES]
    BookingReference:
      type: string
      pattern: '^TLT-[A-Z0-9]{6}$'
      examples: [TLT-8H3K2M]
    GateGroup:
      type: string
      pattern: '^[A-Z0-9]+-(LOWER|UPPER)$'
      description: '`<stand code>-<tier>`. A ticket may only enter by gates of its group.'
      examples: [N-LOWER]
    ColorHex:
      type: string
      pattern: '^#[0-9A-Fa-f]{6}$'
      examples: ['#2E7D32']
    Point:
      type: array
      description: '`[x, y]` in venue plan coordinates (y grows downwards).'
      prefixItems:
        - { type: number, description: x }
        - { type: number, description: y }
      items: false
      minItems: 2
      maxItems: 2
    Polygon:
      type: array
      description: A closed outline; the last point is not repeated.
      items: { $ref: '#/components/schemas/Point' }
    Bounds:
      type: object
      description: Axis-aligned box in venue plan coordinates.
      additionalProperties: false
      required: [min_x, min_y, max_x, max_y]
      properties:
        min_x: { type: number }
        min_y: { type: number }
        max_x: { type: number }
        max_y: { type: number }
    Role:
      type: string
      enum: [FAN, ORGANISER, ADMIN, GATE_STAFF]
    Tier:
      type: string
      enum: [LOWER, UPPER]
    SeatType:
      type: string
      enum: [STANDARD, ACCESSIBLE, COMPANION, RESTRICTED_VIEW]
    EventStatus:
      type: string
      enum: [DRAFT, PUBLISHED, ON_SALE, SOLD_OUT, CANCELLED, COMPLETED]
    PublicEventStatus:
      type: string
      description: The statuses the public event list shows.
      enum: [PUBLISHED, ON_SALE, SOLD_OUT]
    SeatStatus:
      type: string
      description: Inventory status as stored. The seat map sends the one-letter codes instead.
      enum: [AVAILABLE, HELD, SOLD, BLOCKED]
    HoldStatus:
      type: string
      enum: [ACTIVE, CONVERTED, EXPIRED, RELEASED]
    BookingStatus:
      type: string
      description: |
        `REFUND_REQUIRED` means money arrived but the seats could not be given (the hold
        had lapsed and they were resold, or the amount was wrong), or the event was
        cancelled after the booking was paid. No valid tickets exist; a refund is queued.
        It becomes `REFUNDED` when every refund is recorded as paid.

        `EXPIRED`: the hold ran out before a payment succeeded. `CANCELLED`: the fan
        released the hold, or the event was cancelled before payment. Either can still
        become `REFUND_REQUIRED` if M-Pesa reports a payment afterwards. `FAILED` is
        reserved; nothing sets it today. A `PAID` booking only ever changes to
        `REFUND_REQUIRED`, and only when its event is cancelled.
      enum: [PENDING_PAYMENT, PAID, FAILED, EXPIRED, CANCELLED, REFUND_REQUIRED, REFUNDED]
    PaymentStatus:
      type: string
      description: |
        `INITIATED` and `PENDING` are live. `SUCCESS` and `FAILED` are M-Pesa's verdicts and
        final. `TIMEOUT` is ours (no answer in 5 minutes): the fan may start another
        payment, and if M-Pesa reports afterwards it still becomes `SUCCESS` or `FAILED`.
        `SUCCESS` means the money arrived, not that tickets exist: read `booking_status`.
        `REVERSED` is reserved.
      enum: [INITIATED, PENDING, SUCCESS, FAILED, TIMEOUT, REVERSED]
    PaymentProvider:
      type: string
      enum: [MPESA]
    PaymentFailureReason:
      type: string
      description: |
        Why a payment did not succeed, in a form the app can switch on. `wrong_amount`: M-Pesa
        reported a payment of a different amount from the booking total; the payment is
        `FAILED`, the booking `REFUND_REQUIRED`, and what was paid is queued for refund.
      enum: [insufficient_funds, wrong_pin, cancelled, timeout, wrong_amount, other]
    MockOutcome:
      type: string
      description: |
        - `success` - callback arrives, payment succeeds.
        - `insufficient_funds`, `wrong_pin`, `user_cancel` - callback arrives with that failure.
        - `timeout` - the fan never answers the prompt; the callback reports a timeout.
        - `no_callback` - no callback at all; reconciliation finds the (successful) result.
        - `duplicate_callback` - the success callback is delivered twice.
        - `late_callback` - the success callback arrives late (after `MOCK_LATE_CALLBACK_DELAY`,
          7 minutes by default): after the payment has been marked `TIMEOUT` and the hold
          has expired. The payment then becomes `SUCCESS`; the booking is `PAID` if the hold
          still had every seat, otherwise `REFUND_REQUIRED`.
        - `wrong_amount` - the callback reports one shilling more than the booking total:
          payment `FAILED` with `failure_reason: wrong_amount`, booking `REFUND_REQUIRED`.
      enum: [success, insufficient_funds, wrong_pin, user_cancel, timeout, no_callback, duplicate_callback, late_callback, wrong_amount]
    TicketStatus:
      type: string
      enum: [VALID, USED, VOID, TRANSFERRED]
    ScanResult:
      type: string
      enum: [ADMITTED, DUPLICATE, INVALID, WRONG_EVENT, WRONG_GATE]
    RefundStatus:
      type: string
      enum: [PENDING, DONE]
    AlertKind:
      type: string
      description: |
        - `REFUND_REQUIRED` - a payment arrived and bought nothing (seats resold, hold gone,
          event cancelled, or the booking was already paid). A refund is in the queue.
        - `AMOUNT_MISMATCH` - M-Pesa itself reported a payment of the wrong amount: a refund
          for what M-Pesa says was paid is in the queue. Or a callback named an amount other
          than the one requested for a payment M-Pesa confirmed: the payment was treated as
          paid in full, NO refund is queued, and the message says to check the statement.
        - `PAYMENT_UNRESOLVED` - we do not know what became of some money. Either M-Pesa gave
          no final answer for a payment within 5 minutes and it was closed as `TIMEOUT`; or a
          payment request may have reached M-Pesa without us learning its ID; or M-Pesa
          reported a payment we cannot match to any booking (the message names the receipt,
          the amount and the phone); or a stored callback could not be confirmed in 7 days.
          Check the M-Pesa portal; nothing is queued. It is closed automatically, with a
          `resolution`, if the payment later ends in tickets or a queued refund.
      enum: [REFUND_REQUIRED, AMOUNT_MISMATCH, PAYMENT_UNRESOLVED]
    NumberingDirection:
      type: string
      description: Which end of a row seat 1 is at, looking from the pitch along the block's local x axis.
      enum: [LTR, RTL]
    RowLabelScheme:
      type: string
      description: '`ALPHA`: A to Z, then AA, AB and so on; a seat label is the row label and the seat number (`C14`). `NUMERIC`: 1, 2, 3 and so on; a seat label then has a dash between them (`12-14`), because `1214` could be three different seats. Front row first.'
      enum: [ALPHA, NUMERIC]
    SalesBucket:
      type: string
      enum: [hour, day]

    # -------------------------------------------------------------------------
    # Errors
    # -------------------------------------------------------------------------
    ErrorCode:
      type: string
      description: Every code the API can return. See `docs/API_NOTES.md` for status and meaning.
      enum:
        - VALIDATION_FAILED
        - IDEMPOTENCY_KEY_REQUIRED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - OTP_INVALID
        - OTP_EXPIRED
        - INVALID_CREDENTIALS
        - MFA_TOKEN_INVALID
        - TOTP_INVALID
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - FORBIDDEN
        - MOCK_NOT_ALLOWED
        - NOT_FOUND
        - INVITATION_INVALID
        - INVITATION_EXPIRED
        - SEATS_UNAVAILABLE
        - NO_ADJACENT_SEATS
        - EVENT_NOT_ON_SALE
        - SALES_NOT_OPEN
        - SALES_CLOSED
        - HOLD_EXPIRED
        - HOLD_NOT_ACTIVE
        - HOLD_ALREADY_BOOKED
        - BOOKING_NOT_PAYABLE
        - PAYMENT_IN_PROGRESS
        - EVENT_NOT_READY
        - INVALID_STATE_TRANSITION
        - EVENT_NOT_EDITABLE
        - EVENT_BUSY
        - BLOCK_HAS_INVENTORY
        - CATEGORY_IN_USE
        - CONFIRMATION_REQUIRED
        - ALREADY_EXISTS
        - EMAIL_ALREADY_REGISTERED
        - INVITATION_ALREADY_PENDING
        - INVITATION_NOT_PENDING
        - TOTP_ALREADY_ENABLED
        - TOTP_NOT_ENABLED
        - TOTP_SETUP_REQUIRED
        - PAYLOAD_TOO_LARGE
        - TICKET_LIMIT_EXCEEDED
        - IDEMPOTENCY_KEY_REUSED
        - VENUE_MISMATCH
        - PASSWORD_INCORRECT
        - TOTP_CODE_INCORRECT
        - RATE_LIMITED
        - OTP_ATTEMPTS_EXCEEDED
        - INTERNAL
        - PAYMENT_PROVIDER_UNAVAILABLE
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message:
              type: string
              description: Plain English, safe to show to the user.
            details:
              description: Null, or an object whose shape is fixed by `code`.
              anyOf:
                - { type: 'null' }
                - { $ref: '#/components/schemas/ValidationDetails' }
                - { $ref: '#/components/schemas/SeatsUnavailableDetails' }
                - { $ref: '#/components/schemas/TicketLimitDetails' }
                - { $ref: '#/components/schemas/SalesWindowDetails' }
                - { $ref: '#/components/schemas/NoAdjacentSeatsDetails' }
                - { $ref: '#/components/schemas/HoldStateDetails' }
                - { $ref: '#/components/schemas/BookingStateDetails' }
                - { $ref: '#/components/schemas/PaymentInProgressDetails' }
                - { $ref: '#/components/schemas/NotReadyDetails' }
                - { $ref: '#/components/schemas/EventStateDetails' }
                - { $ref: '#/components/schemas/SalesStartedDetails' }
                - { $ref: '#/components/schemas/CategoryInUseDetails' }
                - { $ref: '#/components/schemas/InventoryDetails' }
                - { $ref: '#/components/schemas/RateLimitDetails' }
    ValidationDetails:
      type: object
      description: For `VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`, `ALREADY_EXISTS`, `VENUE_MISMATCH`.
      additionalProperties: false
      required: [fields]
      properties:
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, rule, message]
            properties:
              field:
                type: string
                description: JSON path of the field in the request (`seat_ids[2]`), or the query, path or header name.
              rule:
                type: string
                description: The rule that failed, for example `required`, `e164`, `min`, `max`, `unique`.
              message:
                type: string
                description: Plain English, to show next to the field.
    SeatsUnavailableDetails:
      type: object
      description: For `SEATS_UNAVAILABLE`.
      additionalProperties: false
      required: [unavailable_seat_ids]
      properties:
        unavailable_seat_ids:
          type: array
          description: The event seat IDs from the request that could not be held.
          items: { $ref: '#/components/schemas/Id' }
    TicketLimitDetails:
      type: object
      description: For `TICKET_LIMIT_EXCEEDED`.
      additionalProperties: false
      required: [allowed, held_or_bought, requested, remaining]
      properties:
        allowed: { type: integer, description: The event's `max_tickets_per_user`. }
        held_or_bought: { type: integer, description: Seats in the caller's active holds plus paid bookings. }
        requested: { type: integer }
        remaining: { type: integer, minimum: 0, description: How many more the caller may hold now. }
    SalesWindowDetails:
      type: object
      description: For `EVENT_NOT_ON_SALE`, `SALES_NOT_OPEN`, `SALES_CLOSED`.
      additionalProperties: false
      required: [event_status, sales_open_at, sales_close_at]
      properties:
        event_status: { $ref: '#/components/schemas/EventStatus' }
        sales_open_at: { type: [string, 'null'], format: date-time }
        sales_close_at: { type: [string, 'null'], format: date-time }
    NoAdjacentSeatsDetails:
      type: object
      description: For `NO_ADJACENT_SEATS`.
      additionalProperties: false
      required: [category_id, quantity, available]
      properties:
        category_id: { $ref: '#/components/schemas/Id' }
        quantity: { type: integer }
        available: { type: integer, description: 'Seats still available in the category, together or not.' }
    HoldStateDetails:
      type: object
      description: 'For `HOLD_EXPIRED`, `HOLD_NOT_ACTIVE`. `hold_status` is `EXPIRED` for a hold that ran out; a payment refused because the hold has too little time left carries `ACTIVE` and the real `expires_at`.'
      additionalProperties: false
      required: [hold_id, hold_status, expires_at]
      properties:
        hold_id: { $ref: '#/components/schemas/Id' }
        hold_status: { $ref: '#/components/schemas/HoldStatus' }
        expires_at: { type: string, format: date-time }
    BookingStateDetails:
      type: object
      description: For `BOOKING_NOT_PAYABLE`, `HOLD_ALREADY_BOOKED`.
      additionalProperties: false
      required: [booking_reference, booking_status]
      properties:
        booking_reference: { $ref: '#/components/schemas/BookingReference' }
        booking_status: { $ref: '#/components/schemas/BookingStatus' }
    PaymentInProgressDetails:
      type: object
      description: For `PAYMENT_IN_PROGRESS`.
      additionalProperties: false
      required: [payment_id, payment_status]
      properties:
        payment_id: { $ref: '#/components/schemas/Id' }
        payment_status: { $ref: '#/components/schemas/PaymentStatus' }
    NotReadyDetails:
      type: object
      description: For `EVENT_NOT_READY`.
      additionalProperties: false
      required: [problems]
      properties:
        problems:
          type: array
          items: { $ref: '#/components/schemas/ReadinessProblem' }
    EventStateDetails:
      type: object
      description: For `INVALID_STATE_TRANSITION`, `EVENT_NOT_EDITABLE`.
      additionalProperties: false
      required: [current_status]
      properties:
        current_status: { $ref: '#/components/schemas/EventStatus' }
    SalesStartedDetails:
      type: object
      description: For `CONFIRMATION_REQUIRED`.
      additionalProperties: false
      required: [sold, held]
      properties:
        sold: { type: integer }
        held: { type: integer }
    CategoryInUseDetails:
      type: object
      description: For `CATEGORY_IN_USE`.
      additionalProperties: false
      required: [seats, sold, held]
      properties:
        seats:
          type: integer
          description: Seats published in this category (the event's inventory rows that point at it), whatever their status. Above zero as soon as the event is published with the category painted on any seat.
        sold: { type: integer, description: How many of those seats are sold. }
        held: { type: integer, description: How many of those seats are in a live hold. }
    InventoryDetails:
      type: object
      description: For `BLOCK_HAS_INVENTORY`.
      additionalProperties: false
      required: [event_ids]
      properties:
        event_ids:
          type: array
          items: { $ref: '#/components/schemas/Id' }
    RateLimitDetails:
      type: object
      description: For `RATE_LIMITED`, `OTP_ATTEMPTS_EXCEEDED`.
      additionalProperties: false
      required: [retry_after_seconds]
      properties:
        retry_after_seconds: { type: integer, minimum: 0 }

    # -------------------------------------------------------------------------
    # Health, auth, users
    # -------------------------------------------------------------------------
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded]
    OtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
    OtpRequested:
      type: object
      additionalProperties: false
      required: [expires_in_seconds, resend_after_seconds]
      properties:
        expires_in_seconds: { type: integer, description: How long the code is good for. }
        resend_after_seconds: { type: integer, description: How long before another code may be requested for this phone. }
        dev_code:
          type: string
          pattern: '^[0-9]{6}$'
          description: The code itself. **Only outside production**; absent when `APP_ENV=production`.
    OtpVerify:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        code: { type: string, pattern: '^[0-9]{6}$' }
    PasswordLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 256 }
    LoginResult:
      description: Answer of `POST /auth/login`. Switch on `mfa_required`.
      oneOf:
        - $ref: '#/components/schemas/LoginSession'
        - $ref: '#/components/schemas/MfaChallenge'
    LoginSession:
      type: object
      description: 'The same fields as `AuthSession`, plus `mfa_required: false`.'
      additionalProperties: false
      required: [mfa_required, access_token, token_type, expires_in_seconds, refresh_token, refresh_expires_at, user]
      properties:
        mfa_required:
          type: boolean
          enum: [false]
        access_token: { type: string }
        token_type:
          type: string
          enum: [Bearer]
        expires_in_seconds: { type: integer }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    MfaChallenge:
      type: object
      additionalProperties: false
      required: [mfa_required, mfa_token, expires_in_seconds]
      properties:
        mfa_required:
          type: boolean
          enum: [true]
        mfa_token:
          type: string
          description: Only accepted by `POST /auth/totp/verify`. Never a bearer token.
        expires_in_seconds: { type: integer }
    TotpVerify:
      type: object
      additionalProperties: false
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string, minLength: 1 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 1, maxLength: 512 }
    AuthSession:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in_seconds, refresh_token, refresh_expires_at, user]
      properties:
        access_token: { type: string, description: JWT. Send as `Authorization` `Bearer`. }
        token_type:
          type: string
          enum: [Bearer]
        expires_in_seconds: { type: integer, description: Life of the access token (900). }
        refresh_token: { type: string, description: Opaque. Works once; keep it in secure storage. }
        refresh_expires_at: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
      example:
        access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI0MiJ9.c2ln
        token_type: Bearer
        expires_in_seconds: 900
        refresh_token: rt_5Jq0m1Zb2Xc3Vd4Ne5Mf6Lg7Kh8Ji9
        refresh_expires_at: '2026-11-10T09:00:00Z'
        user:
          id: 42
          phone: '+254712345678'
          email: null
          name: null
          role: FAN
          totp_enabled: false
          created_at: '2026-10-11T09:00:00Z'
    User:
      type: object
      additionalProperties: false
      required: [id, phone, email, name, role, totp_enabled, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        phone:
          description: Null for staff accounts that sign in by email.
          anyOf:
            - { $ref: '#/components/schemas/Phone' }
            - { type: 'null' }
        email: { type: [string, 'null'], format: email }
        name: { type: [string, 'null'], description: Null until the user sets one. }
        role: { $ref: '#/components/schemas/Role' }
        totp_enabled: { type: boolean, description: Whether sign-in asks for a TOTP code. Always false for phone accounts. }
        created_at: { type: string, format: date-time }
    UpdateMe:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    Password:
      type: string
      minLength: 10
      maxLength: 256
      description: At least 10 characters.
    ChangePassword:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: { type: string, minLength: 1, maxLength: 256 }
        new_password: { $ref: '#/components/schemas/Password' }
    PasswordConfirm:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
    TotpCode:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    TotpSetup:
      type: object
      additionalProperties: false
      required: [secret, otpauth_url]
      properties:
        secret: { type: string, description: 'Base32 secret, for typing into an authenticator by hand. Shown once.' }
        otpauth_url: { type: string, description: The `otpauth://totp/...` URL to draw as a QR code. }
    StaffRole:
      type: string
      enum: [ORGANISER, ADMIN]
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, EXPIRED, REVOKED]
    CreateInvitation:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: '#/components/schemas/StaffRole' }
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, status, invited_by, expires_at, created_at, accepted_at, invite_url]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/StaffRole' }
        status: { $ref: '#/components/schemas/InvitationStatus' }
        invited_by:
          type: object
          additionalProperties: false
          required: [id, name, email]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: [string, 'null'] }
            email: { type: [string, 'null'], format: email }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        accepted_at: { type: [string, 'null'], format: date-time }
        invite_url:
          type: [string, 'null']
          format: uri
          description: |
            The link to send to the invitee; it contains the one-time token. Set only in
            the answers of create and resend. Null everywhere else: the server keeps only a
            hash of the token.
    InvitationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        next_cursor: { type: [string, 'null'] }
    InvitationPreview:
      type: object
      additionalProperties: false
      required: [email, role, expires_at]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/StaffRole' }
        expires_at: { type: string, format: date-time }
    AcceptInvitation:
      type: object
      additionalProperties: false
      required: [name, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        password: { $ref: '#/components/schemas/Password' }
    StaffUser:
      type: object
      additionalProperties: false
      required: [id, name, email, role, totp_enabled, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: [string, 'null'] }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/StaffRole' }
        totp_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
    StaffUserPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/StaffUser' }
        next_cursor: { type: [string, 'null'] }

    # -------------------------------------------------------------------------
    # Events and categories
    # -------------------------------------------------------------------------
    EventSummary:
      type: object
      description: The few event fields carried inside bookings and tickets.
      additionalProperties: false
      required: [id, title, competition, home_team, away_team, kickoff_at, gates_open_at, venue_name, poster_url, status]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        competition: { type: [string, 'null'] }
        home_team: { type: [string, 'null'] }
        away_team: { type: [string, 'null'] }
        kickoff_at: { type: string, format: date-time }
        gates_open_at: { type: [string, 'null'], format: date-time }
        venue_name: { type: string }
        poster_url: { type: [string, 'null'], format: uri }
        status: { $ref: '#/components/schemas/EventStatus' }
    Event:
      type: object
      additionalProperties: false
      required:
        - id
        - venue_id
        - venue_name
        - title
        - competition
        - home_team
        - away_team
        - kickoff_at
        - gates_open_at
        - poster_url
        - status
        - sales_open_at
        - sales_close_at
        - max_tickets_per_user
        - currency
        - price_from_cents
        - seats_available
        - seats_total
        - published_at
        - created_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        venue_id: { $ref: '#/components/schemas/Id' }
        venue_name: { type: string }
        title: { type: string }
        competition: { type: [string, 'null'] }
        home_team: { type: [string, 'null'] }
        away_team: { type: [string, 'null'] }
        kickoff_at: { type: string, format: date-time }
        gates_open_at: { type: [string, 'null'], format: date-time }
        poster_url: { type: [string, 'null'], format: uri }
        status: { $ref: '#/components/schemas/EventStatus' }
        sales_open_at: { type: [string, 'null'], format: date-time }
        sales_close_at: { type: [string, 'null'], format: date-time }
        max_tickets_per_user: { type: integer, minimum: 1 }
        currency: { $ref: '#/components/schemas/Currency' }
        price_from_cents:
          type: [integer, 'null']
          format: int64
          description: Cheapest seat available now. Null when none is, or before publish.
        seats_available: { type: integer, description: Zero before publish. }
        seats_total: { type: integer, description: 'Inventory rows for the event, blocked seats included. Zero before publish.' }
        published_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        next_cursor: { type: [string, 'null'] }
    CreateEvent:
      type: object
      additionalProperties: false
      required: [venue_id, title, kickoff_at]
      properties:
        venue_id: { $ref: '#/components/schemas/Id' }
        title: { type: string, minLength: 1, maxLength: 200 }
        competition: { type: [string, 'null'], maxLength: 200 }
        home_team: { type: [string, 'null'], maxLength: 100 }
        away_team: { type: [string, 'null'], maxLength: 100 }
        kickoff_at: { type: string, format: date-time }
        gates_open_at: { type: [string, 'null'], format: date-time, description: Must be before `kickoff_at`. }
        poster_url: { type: [string, 'null'], format: uri, maxLength: 2048, description: An `http` or `https` address. }
        sales_open_at: { type: [string, 'null'], format: date-time }
        sales_close_at: { type: [string, 'null'], format: date-time, description: After `sales_open_at` and not after `kickoff_at`. }
        max_tickets_per_user: { type: integer, minimum: 1, maximum: 50, description: Optional. 6 when left out. }
        template_id:
          description: Copy this venue template's categories and assignments onto the new event.
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - { type: 'null' }
    UpdateEvent:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        competition: { type: [string, 'null'], maxLength: 200 }
        home_team: { type: [string, 'null'], maxLength: 100 }
        away_team: { type: [string, 'null'], maxLength: 100 }
        kickoff_at: { type: string, format: date-time }
        gates_open_at: { type: [string, 'null'], format: date-time }
        poster_url: { type: [string, 'null'], format: uri, maxLength: 2048 }
        sales_open_at: { type: [string, 'null'], format: date-time }
        sales_close_at: { type: [string, 'null'], format: date-time }
        max_tickets_per_user: { type: integer, minimum: 1, maximum: 50 }
    Category:
      type: object
      additionalProperties: false
      required: [id, event_id, name, description, price_cents, currency, color_hex, seats_available, seats_total]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        event_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: [string, 'null'] }
        price_cents: { type: integer, format: int64, minimum: 0 }
        currency: { $ref: '#/components/schemas/Currency' }
        color_hex: { $ref: '#/components/schemas/ColorHex' }
        seats_available: { type: integer, description: Zero before publish. }
        seats_total: { type: integer, description: Zero before publish. }
    CategoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Category' }
    CreateCategory:
      type: object
      additionalProperties: false
      required: [name, price_cents, color_hex]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        price_cents: { type: integer, format: int64, minimum: 0, description: 'Zero is accepted while the event is `DRAFT` (it blocks publishing) and refused afterwards.' }
        color_hex: { $ref: '#/components/schemas/ColorHex' }
        description: { type: [string, 'null'], maxLength: 500 }
    UpdateCategory:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        price_cents: { type: integer, format: int64, minimum: 0 }
        color_hex: { $ref: '#/components/schemas/ColorHex' }
        description: { type: [string, 'null'], maxLength: 500 }
        confirm:
          type: boolean
          description: Optional; false when left out. Must be true to change the price once the event has left `DRAFT`.

    # -------------------------------------------------------------------------
    # Seat map
    # -------------------------------------------------------------------------
    MapCategory:
      type: object
      description: A category as the seat map needs it. Sent once per answer.
      additionalProperties: false
      required: [id, name, price_cents, color_hex]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        price_cents: { type: integer, format: int64 }
        color_hex: { $ref: '#/components/schemas/ColorHex' }
    StadiumMap:
      type: object
      additionalProperties: false
      required: [event_id, venue, currency, stands]
      properties:
        event_id: { $ref: '#/components/schemas/Id' }
        venue:
          type: object
          additionalProperties: false
          required: [id, name, plan_width, plan_height]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            plan_width: { type: integer, description: Width of the coordinate space every polygon and seat is drawn in. }
            plan_height: { type: integer }
        currency: { $ref: '#/components/schemas/Currency' }
        stands:
          type: array
          description: In drawing order.
          items: { $ref: '#/components/schemas/MapStand' }
      example:
        event_id: 1
        venue: { id: 1, name: Talanta Stadium, plan_width: 10000, plan_height: 8000 }
        currency: KES
        stands:
          - id: 3
            code: N
            name: North Lower
            tier: LOWER
            gate_group: N-LOWER
            polygon: [[3000, 400], [7000, 400], [6600, 1200], [3400, 1200]]
            seats_total: 7500
            seats_available: 5120
            price_from_cents: 50000
    MapStand:
      type: object
      additionalProperties: false
      required: [id, code, name, tier, gate_group, polygon, seats_total, seats_available, price_from_cents]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string, examples: [N] }
        name: { type: string }
        tier: { $ref: '#/components/schemas/Tier' }
        gate_group: { $ref: '#/components/schemas/GateGroup' }
        polygon: { $ref: '#/components/schemas/Polygon' }
        seats_total: { type: integer }
        seats_available: { type: integer }
        price_from_cents:
          type: [integer, 'null']
          format: int64
          description: Cheapest available seat in the stand. Null when none is available.
    StandBlocks:
      type: object
      additionalProperties: false
      required: [event_id, stand, currency, categories, blocks]
      properties:
        event_id: { $ref: '#/components/schemas/Id' }
        stand:
          type: object
          additionalProperties: false
          required: [id, code, name, tier, gate_group, polygon]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            code: { type: string }
            name: { type: string }
            tier: { $ref: '#/components/schemas/Tier' }
            gate_group: { $ref: '#/components/schemas/GateGroup' }
            polygon: { $ref: '#/components/schemas/Polygon' }
        currency: { $ref: '#/components/schemas/Currency' }
        categories:
          type: array
          description: Every category that appears in this stand.
          items: { $ref: '#/components/schemas/MapCategory' }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/MapBlock' }
    MapBlock:
      type: object
      additionalProperties: false
      required: [id, code, label, outline, seats_total, seats_available, price_from_cents, badges]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string, examples: [N12] }
        label: { type: string }
        outline: { $ref: '#/components/schemas/Polygon' }
        seats_total: { type: integer }
        seats_available: { type: integer }
        price_from_cents:
          type: [integer, 'null']
          format: int64
          description: Cheapest available seat in the block. Null when none is available.
        badges:
          type: array
          description: One per category present in the block, cheapest first. Usually one.
          items:
            type: object
            additionalProperties: false
            required: [category_id, seats_available]
            properties:
              category_id: { $ref: '#/components/schemas/Id', description: Points into `categories`. }
              seats_available: { type: integer }
    BlockSeats:
      description: Level 3. Switch on `kind`.
      oneOf:
        - $ref: '#/components/schemas/BlockSeatsFull'
        - $ref: '#/components/schemas/BlockSeatsDelta'
      discriminator:
        propertyName: kind
        mapping:
          full: '#/components/schemas/BlockSeatsFull'
          delta: '#/components/schemas/BlockSeatsDelta'
    BlockSeatsFull:
      type: object
      additionalProperties: false
      required: [kind, marker, poll_interval_seconds, block, categories, rows]
      properties:
        kind:
          type: string
          enum: [full]
        marker:
          type: string
          description: Opaque. Send back as `since` to get only what changed after this answer.
        poll_interval_seconds: { type: integer, minimum: 1, description: How often the client should poll. }
        block:
          type: object
          additionalProperties: false
          required: [id, stand_id, code, label, rotation_deg, seat_pitch_x, seat_pitch_y, bounds]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            stand_id: { $ref: '#/components/schemas/Id' }
            code: { type: string }
            label: { type: string }
            rotation_deg: { type: number, description: Clockwise rotation of the block on the plan. Lets the client turn the block to face up. }
            seat_pitch_x: { type: number, description: Distance between seat centres in a row. A seat is drawn a little smaller than this. }
            seat_pitch_y: { type: number, description: Distance between rows. }
            bounds:
              $ref: '#/components/schemas/Bounds'
              description: Box around every seat, half a pitch larger than the seat centres. The initial viewport.
        categories:
          type: array
          description: The category table. Seat tuples point into it by position (`category_index`).
          items: { $ref: '#/components/schemas/MapCategory' }
        rows:
          type: array
          description: Front row first.
          items:
            type: object
            additionalProperties: false
            required: [label, seats]
            properties:
              label: { type: string, description: 'Row label, for example `C`. A seat''s label is the row label followed by its number (`C14`); when the row label is a number a dash goes between them (`12-14`).' }
              seats:
                type: array
                items: { $ref: '#/components/schemas/SeatTuple' }
    BlockSeatsDelta:
      type: object
      additionalProperties: false
      required: [kind, marker, poll_interval_seconds, changes]
      properties:
        kind:
          type: string
          enum: [delta]
        marker: { type: string, description: The new marker. Replace the old one with it. }
        poll_interval_seconds: { type: integer, minimum: 1 }
        changes:
          type: array
          description: Seats whose status changed. Often empty.
          items: { $ref: '#/components/schemas/SeatChangeTuple' }
    SeatStatusCode:
      type: string
      description: |
        One-letter seat status on the seat map.

        | Code | Meaning |
        |---|---|
        | `A` | Available |
        | `H` | Held by someone else |
        | `M` | Held by you (only with a FAN token that owns the hold) |
        | `S` | Sold |
        | `B` | Blocked (not for sale) |
      enum: [A, H, M, S, B]
    SeatTypeCode:
      type: integer
      description: '`0` STANDARD, `1` ACCESSIBLE, `2` COMPANION, `3` RESTRICTED_VIEW.'
      enum: [0, 1, 2, 3]
    SeatTuple:
      type: array
      description: |
        One seat as a fixed 7-item array, to avoid repeating keys 2,000 times.

        | Pos | Name | Type | Meaning |
        |---|---|---|---|
        | 0 | `event_seat_id` | int64 | The ID to send in `POST /holds` `seat_ids`. |
        | 1 | `seat_number` | int | Number within the row. |
        | 2 | `x` | number | Seat centre, venue plan coordinates, at most 2 decimals. |
        | 3 | `y` | number | Seat centre, venue plan coordinates, at most 2 decimals. |
        | 4 | `type_code` | 0-3 | `0` STANDARD, `1` ACCESSIBLE, `2` COMPANION, `3` RESTRICTED_VIEW. |
        | 5 | `category_index` | int | Position in `categories`, or `-1` when the seat has no category (always blocked). |
        | 6 | `status_code` | letter | `A`, `H`, `M`, `S` or `B`. |
      prefixItems:
        - { type: integer, format: int64, minimum: 1, description: event_seat_id }
        - { type: integer, minimum: 1, description: seat_number }
        - { type: number, description: x }
        - { type: number, description: y }
        - { $ref: '#/components/schemas/SeatTypeCode' }
        - { type: integer, minimum: -1, description: category_index }
        - { $ref: '#/components/schemas/SeatStatusCode' }
      items: false
      minItems: 7
      maxItems: 7
      examples:
        - [910002, 2, 4017.5, 594, 1, 1, M]
    SeatChangeTuple:
      type: array
      description: |
        | Pos | Name | Meaning |
        |---|---|---|
        | 0 | `event_seat_id` | The seat that changed. |
        | 1 | `status_code` | Its status now: `A`, `H`, `M`, `S` or `B`. |
      prefixItems:
        - { type: integer, format: int64, minimum: 1, description: event_seat_id }
        - { $ref: '#/components/schemas/SeatStatusCode' }
      items: false
      minItems: 2
      maxItems: 2
      examples:
        - [910001, H]

    # -------------------------------------------------------------------------
    # Holds
    # -------------------------------------------------------------------------
    CreateHold:
      type: object
      additionalProperties: false
      required: [event_id, seat_ids]
      properties:
        event_id: { $ref: '#/components/schemas/Id' }
        seat_ids:
          type: array
          description: Event seat IDs. No repeats.
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
    CreateBestAvailableHold:
      type: object
      additionalProperties: false
      required: [event_id, category_id, quantity]
      properties:
        event_id: { $ref: '#/components/schemas/Id' }
        category_id: { $ref: '#/components/schemas/Id' }
        quantity: { type: integer, minimum: 1, maximum: 50 }
    SeatLocation:
      type: object
      description: Where a seat is, in words. Shared by holds, bookings and tickets.
      additionalProperties: false
      required: [stand_id, stand_code, stand_name, tier, gate_group, block_id, block_code, block_label, row_label, seat_number, seat_label, seat_type]
      properties:
        stand_id: { $ref: '#/components/schemas/Id' }
        stand_code: { type: string, examples: [N] }
        stand_name: { type: string, examples: [North Lower] }
        tier: { $ref: '#/components/schemas/Tier' }
        gate_group: { $ref: '#/components/schemas/GateGroup' }
        block_id: { $ref: '#/components/schemas/Id' }
        block_code: { type: string, examples: [N12] }
        block_label: { type: string, examples: [North 12] }
        row_label: { type: string, examples: [C] }
        seat_number: { type: integer, examples: [14] }
        seat_label: { type: string, examples: [C14] }
        seat_type: { $ref: '#/components/schemas/SeatType' }
    HoldSeat:
      type: object
      additionalProperties: false
      required: [event_seat_id, location, category_id, category_name, price_cents]
      properties:
        event_seat_id: { $ref: '#/components/schemas/Id' }
        location: { $ref: '#/components/schemas/SeatLocation' }
        category_id: { $ref: '#/components/schemas/Id' }
        category_name: { type: string }
        price_cents: { type: integer, format: int64, description: The category price now. It is fixed when the booking is made. }
    Hold:
      type: object
      additionalProperties: false
      required: [id, event_id, status, expires_at, remaining_seconds, extended, booking_reference, currency, subtotal_cents, fee_cents, total_cents, seats, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        event_id: { $ref: '#/components/schemas/Id' }
        status: { $ref: '#/components/schemas/HoldStatus' }
        expires_at: { type: string, format: date-time, description: The client countdown is computed from this. }
        remaining_seconds: { type: integer, minimum: 0, description: Server's view when it answered. Zero once expired. }
        extended: { type: boolean, description: True once the expiry was pushed out for a payment. It is never pushed twice. }
        booking_reference:
          description: The booking made from this hold, if any.
          anyOf:
            - { $ref: '#/components/schemas/BookingReference' }
            - { type: 'null' }
        currency: { $ref: '#/components/schemas/Currency' }
        subtotal_cents:
          type: integer
          format: int64
          minimum: 0
          description: |
            Sum of the held seats' category prices now. An estimate: the binding prices are
            the ones copied onto the booking when it is created.
        fee_cents:
          type: integer
          format: int64
          minimum: 0
          description: |
            The booking fee a booking made from this hold would charge on `subtotal_cents`:
            always a whole number of shillings (a multiple of 100), rounded to the nearest
            shilling with half a shilling rounding up. Zero when there is no fee. An
            estimate, like `subtotal_cents`.
        total_cents:
          type: integer
          format: int64
          minimum: 0
          description: '`subtotal_cents + fee_cents`: what the fan will be asked to pay, at current prices.'
        seats:
          type: array
          description: |
            Ordered by block, row, then seat number. The seats that belong to the hold now:
            empty once the hold is `EXPIRED` or `RELEASED` (the amounts are then zero).
          items: { $ref: '#/components/schemas/HoldSeat' }
        created_at: { type: string, format: date-time }
      example:
        id: 5521
        event_id: 1
        status: ACTIVE
        expires_at: '2026-10-11T09:25:00Z'
        remaining_seconds: 600
        extended: false
        booking_reference: null
        currency: KES
        subtotal_cents: 100000
        fee_cents: 2500
        total_cents: 102500
        created_at: '2026-10-11T09:15:00Z'
        seats:
          - event_seat_id: 910001
            category_id: 7
            category_name: Regular
            price_cents: 50000
            location:
              stand_id: 3
              stand_code: N
              stand_name: North Lower
              tier: LOWER
              gate_group: N-LOWER
              block_id: 112
              block_code: N12
              block_label: North 12
              row_label: A
              seat_number: 1
              seat_label: A1
              seat_type: STANDARD
          - event_seat_id: 910005
            category_id: 7
            category_name: Regular
            price_cents: 50000
            location:
              stand_id: 3
              stand_code: N
              stand_name: North Lower
              tier: LOWER
              gate_group: N-LOWER
              block_id: 112
              block_code: N12
              block_label: North 12
              row_label: B
              seat_number: 2
              seat_label: B2
              seat_type: RESTRICTED_VIEW
    HoldList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Hold' }

    # -------------------------------------------------------------------------
    # Bookings and payments
    # -------------------------------------------------------------------------
    CreateBooking:
      type: object
      additionalProperties: false
      required: [hold_id]
      properties:
        hold_id: { $ref: '#/components/schemas/Id' }
    BookingItem:
      type: object
      additionalProperties: false
      required: [event_seat_id, location, category_id, category_name, unit_price_cents]
      properties:
        event_seat_id: { $ref: '#/components/schemas/Id' }
        location: { $ref: '#/components/schemas/SeatLocation' }
        category_id: { $ref: '#/components/schemas/Id' }
        category_name: { type: string }
        unit_price_cents: { type: integer, format: int64, description: The price copied at booking time. Never changes. }
    Booking:
      type: object
      additionalProperties: false
      required:
        - id
        - reference
        - status
        - event
        - items
        - currency
        - subtotal_cents
        - fee_cents
        - total_cents
        - hold_id
        - hold_expires_at
        - latest_payment
        - tickets
        - created_at
        - paid_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        reference: { $ref: '#/components/schemas/BookingReference' }
        status: { $ref: '#/components/schemas/BookingStatus' }
        event: { $ref: '#/components/schemas/EventSummary' }
        items:
          type: array
          items: { $ref: '#/components/schemas/BookingItem' }
        currency: { $ref: '#/components/schemas/Currency' }
        subtotal_cents: { type: integer, format: int64 }
        fee_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64, description: '`subtotal_cents + fee_cents`. The amount of the M-Pesa prompt.' }
        hold_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - { type: 'null' }
        hold_expires_at:
          type: [string, 'null']
          format: date-time
          description: When the seats stop being reserved. Meaningful while `PENDING_PAYMENT`; the checkout countdown runs to this. Null once the booking is final.
        latest_payment:
          description: The most recent payment attempt, or null if none was started.
          anyOf:
            - { $ref: '#/components/schemas/Payment' }
            - { type: 'null' }
        tickets:
          type: array
          description: Empty until the booking is `PAID`.
          items: { $ref: '#/components/schemas/Ticket' }
        created_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
    BookingPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Booking' }
        next_cursor: { type: [string, 'null'] }
    StartStkPush:
      type: object
      additionalProperties: false
      required: [booking_id, phone]
      properties:
        booking_id: { $ref: '#/components/schemas/Id' }
        phone:
          $ref: '#/components/schemas/Phone'
          description: The M-Pesa number to prompt. May differ from the account's phone.
    Payment:
      type: object
      description: |
        A payment as its owner (and staff) see it. Daraja's request IDs
        (`CheckoutRequestID`, `MerchantRequestID`) are deliberately NOT part of it: the
        `CheckoutRequestID` is the key a callback is matched by, and no client needs it.
      additionalProperties: false
      required:
        - id
        - booking_id
        - booking_reference
        - booking_status
        - provider
        - status
        - amount_cents
        - currency
        - phone
        - mpesa_receipt
        - failure_reason
        - result_code
        - result_desc
        - created_at
        - completed_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        booking_id: { $ref: '#/components/schemas/Id' }
        booking_reference: { $ref: '#/components/schemas/BookingReference' }
        booking_status: { $ref: '#/components/schemas/BookingStatus' }
        provider: { $ref: '#/components/schemas/PaymentProvider' }
        status: { $ref: '#/components/schemas/PaymentStatus' }
        amount_cents: { type: integer, format: int64 }
        currency: { $ref: '#/components/schemas/Currency' }
        phone: { $ref: '#/components/schemas/Phone' }
        mpesa_receipt: { type: [string, 'null'], description: 'M-Pesa receipt number, once paid.' }
        failure_reason:
          description: 'Null while live and on success. Set for `FAILED` and `TIMEOUT`. `wrong_amount` is a `FAILED` payment whose `result_code` is 0: M-Pesa took the money, we refused it, `booking_status` is `REFUND_REQUIRED`. A `FAILED` or `TIMEOUT` payment can still become `SUCCESS` later, when M-Pesa confirms the money did arrive.'
          anyOf:
            - { $ref: '#/components/schemas/PaymentFailureReason' }
            - { type: 'null' }
        result_code: { type: [integer, 'null'], description: The provider's raw result code. }
        result_desc:
          type: [string, 'null']
          description: |
            The provider's own wording, for display or support only. On a `PENDING` payment
            it is normally null; when it is set there ("We are checking with M-Pesa whether
            the request went through. Do not pay again yet.") the request may or may not
            have reached M-Pesa, and the app should show that text instead of "check your
            phone".
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    MpesaCallback:
      type: object
      description: Daraja's STK push callback envelope, exactly as Safaricom sends it. Unknown fields are accepted and kept in the stored raw body.
      required: [Body]
      properties:
        Body:
          type: object
          required: [stkCallback]
          properties:
            stkCallback:
              type: object
              required: [MerchantRequestID, CheckoutRequestID, ResultCode, ResultDesc]
              properties:
                MerchantRequestID: { type: string }
                CheckoutRequestID: { type: string }
                ResultCode: { type: integer, description: '`0` is success. `1` insufficient funds, `1032` cancelled by user, `1037` timeout, `2001` wrong PIN.' }
                ResultDesc: { type: string }
                CallbackMetadata:
                  type: object
                  description: Present only on success.
                  required: [Item]
                  properties:
                    Item:
                      type: array
                      items:
                        type: object
                        required: [Name]
                        properties:
                          Name: { type: string, description: '`Amount`, `MpesaReceiptNumber`, `Balance`, `TransactionDate`, `PhoneNumber`.' }
                          Value:
                            description: Amount is in shillings (may be fractional). Some items arrive with no value.
                            type: [string, number]
    MpesaCallbackNotStored:
      type: object
      additionalProperties: false
      required: [ResultCode, ResultDesc]
      properties:
        ResultCode:
          type: integer
          enum: [1]
        ResultDesc:
          type: string
    MpesaCallbackAck:
      type: object
      additionalProperties: false
      required: [ResultCode, ResultDesc]
      properties:
        ResultCode:
          type: integer
          enum: [0]
        ResultDesc:
          type: string
          enum: [Accepted]

    # -------------------------------------------------------------------------
    # Tickets
    # -------------------------------------------------------------------------
    Ticket:
      type: object
      description: Self-contained, so the app can show it with no network.
      additionalProperties: false
      required:
        - id
        - status
        - event
        - booking_reference
        - location
        - category_name
        - holder_name
        - holder_phone
        - qr_token
        - issued_at
        - used_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/TicketStatus' }
        event: { $ref: '#/components/schemas/EventSummary' }
        booking_reference: { $ref: '#/components/schemas/BookingReference' }
        location: { $ref: '#/components/schemas/SeatLocation' }
        category_name: { type: string }
        holder_name: { type: [string, 'null'] }
        holder_phone:
          anyOf:
            - { $ref: '#/components/schemas/Phone' }
            - { type: 'null' }
        qr_token:
          type: string
          pattern: '^TLT1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          description: The signed string to draw as a QR code, always 160 characters. Layout in `docs/TICKET_FORMAT.md`.
        issued_at: { type: string, format: date-time }
        used_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
    TicketPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        next_cursor: { type: [string, 'null'] }

    # -------------------------------------------------------------------------
    # Admin: venues, blocks, layout
    # -------------------------------------------------------------------------
    Venue:
      type: object
      additionalProperties: false
      required: [id, name, city, capacity, plan_width, plan_height]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        city: { type: string }
        capacity: { type: integer }
        plan_width: { type: integer }
        plan_height: { type: integer }
    VenueList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Venue' }
    VenueDetail:
      type: object
      additionalProperties: false
      required: [id, name, city, capacity, plan_width, plan_height, seat_count, stands]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        city: { type: string }
        capacity: { type: integer }
        plan_width: { type: integer }
        plan_height: { type: integer }
        seat_count: { type: integer, description: Active seats across all blocks. }
        stands:
          type: array
          description: In drawing order.
          items:
            type: object
            additionalProperties: false
            required: [id, code, name, tier, gate_group, polygon, display_order, blocks]
            properties:
              id: { $ref: '#/components/schemas/Id' }
              code: { type: string }
              name: { type: string }
              tier: { $ref: '#/components/schemas/Tier' }
              gate_group: { $ref: '#/components/schemas/GateGroup' }
              polygon: { $ref: '#/components/schemas/Polygon' }
              display_order: { type: integer }
              blocks:
                type: array
                items: { $ref: '#/components/schemas/Block' }
    Block:
      type: object
      additionalProperties: false
      required:
        - id
        - stand_id
        - code
        - label
        - origin_x
        - origin_y
        - rotation_deg
        - arc_radius
        - seat_pitch_x
        - seat_pitch_y
        - row_count
        - seats_per_row
        - numbering_direction
        - seat_count
        - outline
        - has_inventory
      properties:
        id: { $ref: '#/components/schemas/Id' }
        stand_id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        label: { type: string }
        origin_x: { type: number, description: Plan x of the first seat position of the front row. }
        origin_y: { type: number }
        rotation_deg: { type: number, description: Clockwise. At 0 the block faces up the screen. }
        arc_radius: { type: [number, 'null'], description: Radius of the front row. Null for a straight block. }
        seat_pitch_x: { type: number }
        seat_pitch_y: { type: number }
        row_count: { type: integer, description: Zero until seats are generated. }
        seats_per_row: { type: integer }
        numbering_direction: { $ref: '#/components/schemas/NumberingDirection' }
        seat_count: { type: integer, description: Active seats. }
        outline:
          $ref: '#/components/schemas/Polygon'
          description: Empty until seats are generated.
        has_inventory: { type: boolean, description: True when any event was published with this block; it can then not be deleted or regenerated. }
    CreateBlock:
      type: object
      additionalProperties: false
      required: [stand_id, code, label, origin_x, origin_y, seat_pitch_x, seat_pitch_y]
      properties:
        stand_id: { $ref: '#/components/schemas/Id' }
        code: { type: string, minLength: 1, maxLength: 12, pattern: '^[A-Z0-9-]+$' }
        label: { type: string, minLength: 1, maxLength: 60 }
        origin_x: { type: number }
        origin_y: { type: number }
        rotation_deg: { type: number, minimum: -360, maximum: 360, description: Optional. 0 when left out. }
        arc_radius: { type: [number, 'null'], exclusiveMinimum: 0, description: Null or omitted for a straight block. }
        seat_pitch_x: { type: number, exclusiveMinimum: 0 }
        seat_pitch_y: { type: number, exclusiveMinimum: 0 }
    UpdateBlock:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        code: { type: string, minLength: 1, maxLength: 12, pattern: '^[A-Z0-9-]+$' }
        label: { type: string, minLength: 1, maxLength: 60 }
        origin_x: { type: number }
        origin_y: { type: number }
        rotation_deg: { type: number, minimum: -360, maximum: 360 }
        arc_radius: { type: [number, 'null'], exclusiveMinimum: 0, description: Null makes the block straight. }
        seat_pitch_x: { type: number, exclusiveMinimum: 0 }
        seat_pitch_y: { type: number, exclusiveMinimum: 0 }
    GenerateSeats:
      type: object
      additionalProperties: false
      required: [rows, seats_per_row]
      properties:
        rows: { type: integer, minimum: 1, maximum: 200 }
        seats_per_row: { type: integer, minimum: 1, maximum: 500, description: '`rows` x `seats_per_row` may be at most 3,000.' }
        row_label_scheme:
          description: Optional. `ALPHA` when left out.
          allOf:
            - { $ref: '#/components/schemas/RowLabelScheme' }
        numbering_direction:
          description: Optional. `LTR` when left out.
          allOf:
            - { $ref: '#/components/schemas/NumberingDirection' }
        row_offsets:
          type: array
          description: |
            How far each row is shifted along the row direction, in plan units, front row
            first. Empty or omitted means no shift; otherwise exactly one entry per row.
          maxItems: 200
          items: { type: number }
        dry_run:
          type: boolean
          description: Optional; false when left out. True returns the preview and saves nothing.
    BlockLayout:
      type: object
      description: A block's rows and physical seats, generated or saved.
      additionalProperties: false
      required: [block_id, dry_run, seat_count, outline, bounds, rows]
      properties:
        block_id: { $ref: '#/components/schemas/Id' }
        dry_run: { type: boolean, description: True when this is an unsaved preview; row and seat IDs are then null. }
        seat_count: { type: integer }
        outline: { $ref: '#/components/schemas/Polygon' }
        bounds:
          description: Null when the block has no seats.
          anyOf:
            - { $ref: '#/components/schemas/Bounds' }
            - { type: 'null' }
        rows:
          type: array
          description: Front row first.
          items:
            type: object
            additionalProperties: false
            required: [id, label, row_index, x_offset, seats]
            properties:
              id:
                description: Row ID, for `assign-category`. Null in a dry run.
                anyOf:
                  - { $ref: '#/components/schemas/Id' }
                  - { type: 'null' }
              label: { type: string }
              row_index: { type: integer, minimum: 0 }
              x_offset: { type: number }
              seats:
                type: array
                items: { $ref: '#/components/schemas/PhysicalSeatTuple' }
      example:
        block_id: 112
        dry_run: true
        seat_count: 4
        outline: [[4010, 590], [4020, 590], [4020, 606], [4010, 606]]
        bounds: { min_x: 4010, min_y: 590, max_x: 4020, max_y: 606 }
        rows:
          - id: null
            label: A
            row_index: 0
            x_offset: 0
            seats:
              - [null, 1, 4012.5, 594, 0, 1]
              - [null, 2, 4017.5, 594, 0, 1]
          - id: null
            label: B
            row_index: 1
            x_offset: 0
            seats:
              - [null, 1, 4012.5, 602, 0, 1]
              - [null, 2, 4017.5, 602, 0, 1]
    PhysicalSeatTuple:
      type: array
      description: |
        One physical seat as a fixed 6-item array.

        | Pos | Name | Type | Meaning |
        |---|---|---|---|
        | 0 | `seat_id` | int64 or null | Physical seat ID. Null in a dry run. |
        | 1 | `seat_number` | int | Number within the row. |
        | 2 | `x` | number | Seat centre, venue plan coordinates. |
        | 3 | `y` | number | Seat centre, venue plan coordinates. |
        | 4 | `type_code` | 0-3 | `0` STANDARD, `1` ACCESSIBLE, `2` COMPANION, `3` RESTRICTED_VIEW. |
        | 5 | `active` | 0 or 1 | `0` when the seat is switched off and never put on sale. |
      prefixItems:
        - { type: [integer, 'null'], format: int64, description: seat_id }
        - { type: integer, minimum: 1, description: seat_number }
        - { type: number, description: x }
        - { type: number, description: y }
        - { $ref: '#/components/schemas/SeatTypeCode' }
        - { type: integer, enum: [0, 1], description: active }
      items: false
      minItems: 6
      maxItems: 6
    TemplateCategory:
      type: object
      additionalProperties: false
      required: [name, color_hex, price_cents, description]
      properties:
        name: { type: string }
        color_hex: { $ref: '#/components/schemas/ColorHex' }
        price_cents: { type: integer, format: int64 }
        description: { type: [string, 'null'] }
    Template:
      type: object
      additionalProperties: false
      required: [id, venue_id, name, categories, block_assignment_count, row_assignment_count, created_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        venue_id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        categories:
          type: array
          items: { $ref: '#/components/schemas/TemplateCategory' }
        block_assignment_count: { type: integer, description: Blocks the template paints. }
        row_assignment_count: { type: integer, description: Row overrides the template holds. }
        created_at: { type: string, format: date-time }
    TemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Template' }
    CreateTemplate:
      type: object
      additionalProperties: false
      required: [name, event_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        event_id:
          $ref: '#/components/schemas/Id'
          description: The event whose categories and painting to save. Must be at this venue.

    # -------------------------------------------------------------------------
    # Admin: readiness, publish, cancel, painting
    # -------------------------------------------------------------------------
    ReadinessProblem:
      type: object
      description: One thing that stops an event being published. Fields that do not apply to the `code` are null.
      additionalProperties: false
      required: [code, message, block_id, block_code, category_id, category_name, seat_count]
      properties:
        code:
          type: string
          description: |
            - `NO_SEATS` - the venue has no active seats.
            - `NO_CATEGORIES` - the event has no category.
            - `SEATS_WITHOUT_CATEGORY` - one entry per block; `block_id`, `block_code` and `seat_count` are set.
            - `CATEGORY_WITHOUT_PRICE` - one entry per category whose price is zero; `category_id` and `category_name` are set.
            - `SALES_WINDOW_MISSING` - `sales_open_at` or `sales_close_at` is not set.
            - `SALES_WINDOW_INVALID` - close is not after open, or close is after kickoff.
            - `KICKOFF_IN_PAST` - the event has already started.
          enum: [NO_SEATS, NO_CATEGORIES, SEATS_WITHOUT_CATEGORY, CATEGORY_WITHOUT_PRICE, SALES_WINDOW_MISSING, SALES_WINDOW_INVALID, KICKOFF_IN_PAST]
        message: { type: string, description: 'Plain English, ready to show.' }
        block_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - { type: 'null' }
        block_code: { type: [string, 'null'] }
        category_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - { type: 'null' }
        category_name: { type: [string, 'null'] }
        seat_count: { type: [integer, 'null'] }
    Readiness:
      type: object
      additionalProperties: false
      required: [event_id, event_status, ready, seat_total, seats_with_category, problems]
      properties:
        event_id: { $ref: '#/components/schemas/Id' }
        event_status: { $ref: '#/components/schemas/EventStatus' }
        ready: { type: boolean }
        seat_total: { type: integer, description: 'Active seats at the venue: what publishing would put on sale.' }
        seats_with_category: { type: integer }
        problems:
          type: array
          items: { $ref: '#/components/schemas/ReadinessProblem' }
    PublishResult:
      type: object
      additionalProperties: false
      required: [event, seats_on_sale, already_published]
      properties:
        event: { $ref: '#/components/schemas/Event' }
        seats_on_sale: { type: integer, description: Inventory rows that are for sale for this event. }
        already_published: { type: boolean, description: True when this call changed nothing. }
    CancelResult:
      type: object
      additionalProperties: false
      required: [event, tickets_voided, bookings_cancelled, refunds_queued, refund_total_cents, holds_released]
      properties:
        event: { $ref: '#/components/schemas/Event' }
        tickets_voided: { type: integer }
        bookings_cancelled: { type: integer, description: Unpaid bookings closed. }
        refunds_queued: { type: integer }
        refund_total_cents: { type: integer, format: int64 }
        holds_released: { type: integer }
    Assignments:
      type: object
      additionalProperties: false
      required: [event_id, blocks, rows]
      properties:
        event_id: { $ref: '#/components/schemas/Id' }
        blocks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [block_id, category_id]
            properties:
              block_id: { $ref: '#/components/schemas/Id' }
              category_id: { $ref: '#/components/schemas/Id' }
        rows:
          type: array
          description: Row overrides. A row not listed takes its block's category.
          items:
            type: object
            additionalProperties: false
            required: [row_id, block_id, category_id]
            properties:
              row_id: { $ref: '#/components/schemas/Id' }
              block_id: { $ref: '#/components/schemas/Id' }
              category_id: { $ref: '#/components/schemas/Id' }
    AssignCategory:
      type: object
      additionalProperties: false
      required: [category_id, block_ids, row_ids]
      properties:
        category_id:
          description: The category to paint with, or null to clear the listed blocks and rows.
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - { type: 'null' }
        block_ids:
          type: array
          maxItems: 1000
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
        row_ids:
          type: array
          maxItems: 5000
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }

    # -------------------------------------------------------------------------
    # Admin: sales, bookings, alerts, refunds
    # -------------------------------------------------------------------------
    SeatCounts:
      type: object
      additionalProperties: false
      required: [sold, held, available, blocked, total]
      properties:
        sold: { type: integer }
        held: { type: integer }
        available: { type: integer }
        blocked: { type: integer }
        total: { type: integer }
    SalesSummary:
      type: object
      additionalProperties: false
      required: [event_id, generated_at, currency, revenue_cents, seats, refund_required_count, refund_required_cents, open_alert_count, categories, blocks, series]
      properties:
        event_id: { $ref: '#/components/schemas/Id' }
        generated_at: { type: string, format: date-time }
        currency: { $ref: '#/components/schemas/Currency' }
        revenue_cents: { type: integer, format: int64, description: Sum of `total_cents` over `PAID` bookings. }
        seats: { $ref: '#/components/schemas/SeatCounts' }
        refund_required_count: { type: integer, description: Bookings in `REFUND_REQUIRED`. }
        refund_required_cents: { type: integer, format: int64, description: Money owed back on those bookings. }
        open_alert_count: { type: integer, description: Unacknowledged alerts for this event. }
        categories:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category_id, name, color_hex, price_cents, sold, held, available, blocked, total, revenue_cents]
            properties:
              category_id: { $ref: '#/components/schemas/Id' }
              name: { type: string }
              color_hex: { $ref: '#/components/schemas/ColorHex' }
              price_cents: { type: integer, format: int64, description: The price now. }
              sold: { type: integer }
              held: { type: integer }
              available: { type: integer }
              blocked: { type: integer }
              total: { type: integer }
              revenue_cents: { type: integer, format: int64, description: Sum of the prices actually paid in this category. }
        blocks:
          type: array
          description: One row per block, for the heatmap. Draw with the outlines from `GET /admin/venues/{venueId}`.
          items:
            type: object
            additionalProperties: false
            required: [block_id, stand_id, sold, held, total]
            properties:
              block_id: { $ref: '#/components/schemas/Id' }
              stand_id: { $ref: '#/components/schemas/Id' }
              sold: { type: integer }
              held: { type: integer }
              total: { type: integer, description: Seats in the block that are not blocked. }
        series:
          type: object
          additionalProperties: false
          required: [bucket, points]
          properties:
            bucket: { $ref: '#/components/schemas/SalesBucket' }
            points:
              type: array
              description: Oldest first. Buckets with no sales are included as zeros.
              items:
                type: object
                additionalProperties: false
                required: [bucket_start, bookings, tickets, revenue_cents]
                properties:
                  bucket_start: { type: string, format: date-time }
                  bookings: { type: integer, description: Bookings paid in the bucket. }
                  tickets: { type: integer }
                  revenue_cents: { type: integer, format: int64 }
    AdminBooking:
      type: object
      additionalProperties: false
      required:
        - id
        - reference
        - status
        - event_id
        - user
        - seat_count
        - seat_labels
        - currency
        - subtotal_cents
        - fee_cents
        - total_cents
        - latest_payment
        - refund
        - created_at
        - paid_at
        - updated_at
      properties:
        id: { $ref: '#/components/schemas/Id' }
        reference: { $ref: '#/components/schemas/BookingReference' }
        status: { $ref: '#/components/schemas/BookingStatus' }
        event_id: { $ref: '#/components/schemas/Id' }
        user:
          type: object
          additionalProperties: false
          required: [id, name, phone]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: [string, 'null'] }
            phone:
              anyOf:
                - { $ref: '#/components/schemas/Phone' }
                - { type: 'null' }
        seat_count: { type: integer }
        seat_labels:
          type: array
          description: 'Block code and seat label for each seat, for example `N12 C14`.'
          items: { type: string }
        currency: { $ref: '#/components/schemas/Currency' }
        subtotal_cents: { type: integer, format: int64 }
        fee_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        latest_payment:
          anyOf:
            - { $ref: '#/components/schemas/Payment' }
            - { type: 'null' }
        refund:
          description: The booking's refund, if one was queued.
          anyOf:
            - { $ref: '#/components/schemas/Refund' }
            - { type: 'null' }
        created_at: { type: string, format: date-time }
        paid_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: string, format: date-time }
    AdminBookingPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminBooking' }
        next_cursor: { type: [string, 'null'] }
    Alert:
      type: object
      additionalProperties: false
      required: [id, event_id, event_title, booking_id, booking_reference, kind, message, created_at, acknowledged_at, resolution]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        event_id: { $ref: '#/components/schemas/Id' }
        event_title: { type: string, description: The title of the event the alert is filed under. }
        booking_id:
          anyOf:
            - { $ref: '#/components/schemas/Id' }
            - { type: 'null' }
        booking_reference:
          anyOf:
            - { $ref: '#/components/schemas/BookingReference' }
            - { type: 'null' }
        kind: { $ref: '#/components/schemas/AlertKind' }
        message: { type: string }
        created_at: { type: string, format: date-time }
        acknowledged_at:
          type: [string, 'null']
          format: date-time
          description: When the alert was closed, by a person (`ackAlert`) or by the system (then `resolution` is set).
        resolution:
          type: [string, 'null']
          description: |
            Null for an open alert and for one a person acknowledged. Set when the SYSTEM
            closed it because what it asked for is done, and says which:
            a `PAYMENT_UNRESOLVED` alert whose payment later sold its seats or had a refund
            queued; a `REFUND_REQUIRED` or `AMOUNT_MISMATCH` alert whose refund was marked
            as paid back. For display.
    AlertPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        next_cursor: { type: [string, 'null'] }
    Refund:
      type: object
      additionalProperties: false
      required: [id, booking_id, booking_reference, booking_status, event_id, payment_id, amount_cents, currency, phone, mpesa_receipt, reason, status, created_at, completed_at]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        booking_id: { $ref: '#/components/schemas/Id' }
        booking_reference: { $ref: '#/components/schemas/BookingReference' }
        booking_status:
          $ref: '#/components/schemas/BookingStatus'
          description: |
            The booking's status now. `REFUND_REQUIRED`: completing its last pending refund
            makes it `REFUNDED` and voids its tickets. `PAID`: the refund is for a second
            payment; the booking keeps its tickets.
        already_completed:
          type: boolean
          description: Only in the answer of `completeRefund`. True when the refund was already `DONE` and this call changed nothing.
        event_id: { $ref: '#/components/schemas/Id' }
        payment_id: { $ref: '#/components/schemas/Id' }
        amount_cents: { type: integer, format: int64, description: 'What must go back: the amount M-Pesa itself confirmed, never a figure taken from a callback body alone.' }
        currency: { $ref: '#/components/schemas/Currency' }
        phone:
          $ref: '#/components/schemas/Phone'
          description: The number that paid.
        mpesa_receipt: { type: [string, 'null'], description: The receipt of the payment being refunded. }
        reason: { type: string, description: 'Plain English, for example "Paid after the hold expired; seats were resold".' }
        status: { $ref: '#/components/schemas/RefundStatus' }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    RefundPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Refund' }
        next_cursor: { type: [string, 'null'] }

    # -------------------------------------------------------------------------
    # Gate
    # -------------------------------------------------------------------------
    GateEvent:
      type: object
      additionalProperties: false
      required: [id, title, kickoff_at, gates_open_at, status, venue_name]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        kickoff_at: { type: string, format: date-time }
        gates_open_at: { type: [string, 'null'], format: date-time }
        status: { $ref: '#/components/schemas/EventStatus' }
        venue_name: { type: string }
    GateEventListItem:
      type: object
      additionalProperties: false
      required: [event, gate_groups, ticket_count, manifest_version]
      properties:
        event: { $ref: '#/components/schemas/GateEvent' }
        gate_groups:
          type: array
          description: Every gate group of the venue, for the "which gate are you at" picker.
          items: { $ref: '#/components/schemas/GateGroup' }
        ticket_count: { type: integer, description: Tickets that are `VALID` or `USED`. }
        manifest_version:
          type: string
          description: |
            An opaque change marker. It differs from the value in an earlier listing
            exactly when something a device stores about the event changed in between:
            a ticket was issued, used, voided or transferred, or the event's details,
            gate groups or keys changed. It is **not** a manifest `version`: never send
            it as `since` (the answer would be a full manifest).
    GateEventList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GateEventListItem' }
    TicketStatusCode:
      type: string
      description: |
        One-letter ticket status in the manifest.

        | Code | Meaning | Device should |
        |---|---|---|
        | `V` | VALID | Admit. |
        | `U` | USED | Refuse as duplicate. |
        | `X` | VOID | Refuse; remove from the stored set. |
        | `T` | TRANSFERRED | Refuse; remove from the stored set. |

        `X` and `T` appear only in a changes-only manifest.
      enum: [V, U, X, T]
    ManifestTicketTuple:
      type: array
      description: |
        One ticket as a fixed 3-item array.

        | Pos | Name | Type | Meaning |
        |---|---|---|---|
        | 0 | `ticket_id` | uuid string | The ticket ID inside the signed QR payload. |
        | 1 | `gate_group_index` | int | Position in the manifest's `gate_groups` array. |
        | 2 | `status_code` | letter | `V`, `U`, `X` or `T`. |
      prefixItems:
        - { type: string, format: uuid, description: ticket_id }
        - { type: integer, minimum: 0, description: gate_group_index }
        - { $ref: '#/components/schemas/TicketStatusCode' }
      items: false
      minItems: 3
      maxItems: 3
    GateManifest:
      type: object
      additionalProperties: false
      required: [event, version, full, generated_at, keys, gate_groups, ticket_count, tickets]
      properties:
        event: { $ref: '#/components/schemas/GateEvent' }
        version: { type: string, description: Opaque. Send back as `since` next time. }
        full: { type: boolean, description: True - replace the stored ticket set. False - apply `tickets` on top of it. }
        generated_at: { type: string, format: date-time }
        keys:
          type: array
          description: |
            Every public key the server accepts ticket signatures from, so every key
            that signed a ticket for this event; normally one. Public keys only. A token
            names its key by ID. A token whose key ID is not here is invalid.
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [key_id, algorithm, public_key]
            properties:
              key_id:
                type: string
                pattern: '^k[1-9][0-9]{0,4}$'
                description: The letter `k` and the key number a token carries (`k1` to `k65535`).
              algorithm:
                type: string
                enum: [Ed25519]
              public_key:
                type: string
                pattern: '^[A-Za-z0-9_-]{43}$'
                description: The 32-byte Ed25519 public key, base64url without padding.
        gate_groups:
          type: array
          description: The table `gate_group_index` points into. Always the venue's full list, sorted, also in a changes-only manifest. An index is only good for the answer it came in.
          items: { $ref: '#/components/schemas/GateGroup' }
        ticket_count: { type: integer, description: 'Tickets that are `VALID` or `USED` for the event, read in the same snapshot as `tickets`, whatever `tickets` holds. After applying the answer a device holds exactly this many tickets.' }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/ManifestTicketTuple' }
    Scan:
      type: object
      additionalProperties: false
      required: [client_scan_id, ticket_id, event_id, gate_group, scanned_at, result]
      properties:
        client_scan_id: { type: string, format: uuid, description: 'Made on the device, once per scan. The upload is idempotent on it.' }
        ticket_id: { type: string, format: uuid, description: The ticket ID read from the QR payload. }
        event_id:
          $ref: '#/components/schemas/Id'
          description: The event the device was scanning for.
        gate_group:
          $ref: '#/components/schemas/GateGroup'
          description: The gate group the device was set to.
        scanned_at: { type: string, format: date-time, description: 'Device clock at the moment of the scan. Bounded by the server, see the operation.' }
        result:
          $ref: '#/components/schemas/ScanResult'
          description: What the device decided offline and showed to the steward.
        token:
          type: string
          maxLength: 512
          description: The full QR text. Optional, but send it when the device has it so the server can check the signature itself.
    ScanBatch:
      type: object
      additionalProperties: false
      required: [device_id, scans]
      properties:
        device_id: { type: string, minLength: 1, maxLength: 64, description: Stable per install. }
        scans:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/Scan' }
    ScanBatchResult:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          description: Same length and order as the uploaded `scans`.
          items:
            type: object
            additionalProperties: false
            required: [client_scan_id, ticket_id, result, overridden, ticket_status, first_admitted_at]
            properties:
              client_scan_id: { type: string, format: uuid }
              ticket_id: { type: string, format: uuid }
              result:
                $ref: '#/components/schemas/ScanResult'
                description: The server's final result for this scan.
              overridden: { type: boolean, description: True when `result` differs from what the device sent. }
              ticket_status:
                description: The ticket's status now. Null when the server does not know the ticket.
                anyOf:
                  - { $ref: '#/components/schemas/TicketStatus' }
                  - { type: 'null' }
              first_admitted_at:
                type: [string, 'null']
                format: date-time
                description: When the winning admit of this ticket was scanned (the ticket's `used_at`). Null if it was never admitted.
