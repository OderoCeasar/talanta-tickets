openapi: 3.1.0
info:
  title: Talanta Stadium Ticketing API
  version: 1.0.0
  summary: One API for the fan app, the organiser site and the gate scanner.
  description: |
    Contract for every client. TypeScript types are generated from this file with
    `openapi-typescript`; Go handlers are written to match it. Change this file first.

    **Conventions**

    - Every path is under `/v1`.
    - IDs are 64-bit integers sent as JSON numbers. Ticket IDs are UUID strings.
    - Money is integer cents in fields ending `_cents`, with `currency` always `KES`.
    - Times are RFC 3339 in UTC. Clients display them in `Africa/Nairobi`.
    - Lists are paged with `limit` and `cursor`; the answer carries `items` and `next_cursor`
      (null on the last page). Cursors are opaque.
    - Every error has the shape `{ "error": { "code", "message", "details" } }`. `code` is
      stable and machine-readable; `message` is plain English for a person; `details` is null
      or an object whose shape depends on `code`. The full list is in `docs/API_NOTES.md`.
    - Roles: `FAN`, `ORGANISER`, `ADMIN`, `GATE_STAFF`. Each operation names who may call it.
      A signed-in caller with the wrong role gets 403 `FORBIDDEN`. A caller asking for
      another user's hold, booking, payment or ticket gets 404 `NOT_FOUND`, so IDs cannot be
      probed.
    - Responses are gzip-compressed when the client sends `Accept-Encoding: gzip`.
  contact:
    name: Talanta Tickets
    email: oderoceasar@gmail.com
servers:
  - url: https://talanta.vendorsoko.com/v1
    description: Production
  - url: http://localhost:8080/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Liveness check.
  - name: Auth
    description: Phone OTP for fans and gate staff; email and password (plus TOTP when the user has turned it on) for organisers and admins; invitation acceptance.
  - name: Me
    description: The signed-in user, their password and TOTP settings, and their own holds, bookings and tickets.
  - name: Events
    description: Public event listing.
  - name: SeatMap
    description: The three levels of the seat map and the changed-since poll.
  - name: Holds
    description: Temporary seat reservations.
  - name: Bookings
    description: Bookings made from a hold.
  - name: Payments
    description: M-Pesa STK push, payment status and the Daraja callback.
  - name: Tickets
    description: Issued tickets, QR images and the web ticket page.
  - name: AdminVenues
    description: Venue layout - blocks, seat generation and templates.
  - name: AdminEvents
    description: Event management, categories, painting, publish and cancel.
  - name: AdminSales
    description: Sales figures, bookings, alerts and refunds.
  - name: AdminUsers
    description: Staff accounts and invitations. ADMIN only.
  - name: Gate
    description: Gate manifest download and scan upload.

# Shared by every error answer below so the error body is declared once.
x-error-content: &err
  application/json:
    schema:
      $ref: '#/components/schemas/Error'

paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      description: |
        **Role:** public. Checks the database. Also served at `/healthz` (no prefix) for
        container health checks. This is the one endpoint whose failure body is not the
        standard error shape.
      security: []
      responses:
        '200':
          description: The API can reach its database.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok }
        '503':
          description: The database is unreachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: degraded }

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------
  /auth/otp/request:
    post:
      operationId: requestOtp
      tags: [Auth]
      summary: Send a 6-digit sign-in code by SMS
      description: |
        **Role:** public. For fans and gate staff. The code lives 5 minutes. The answer is
        the same whether or not the phone already has an account; a fan account is created
        on first successful verify.

        Rate limited per phone and per IP (429 `RATE_LIMITED`).

        `dev_code` is present only when `APP_ENV` is not `production`. In production the
        field is never sent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpRequest' }
            example: { phone: '+254712345678' }
      responses:
        '200':
          description: Code sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpRequested' }
              example: { expires_in_seconds: 300, resend_after_seconds: 60, dev_code: '482913' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /auth/otp/verify:
    post:
      operationId: verifyOtp
      tags: [Auth]
      summary: Exchange a phone code for tokens
      description: |
        **Role:** public. A code can be used once. After 5 wrong attempts the code is dead
        and a new one must be requested (429 `OTP_ATTEMPTS_EXCEEDED`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerify' }
            example: { phone: '+254712345678', code: '482913' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`OTP_INVALID` (wrong code, or no code was requested) or `OTP_EXPIRED`.'
          content: *err
        '429':
          description: '`OTP_ATTEMPTS_EXCEEDED` (request a new code) or `RATE_LIMITED`.'
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /auth/login:
    post:
      operationId: passwordLogin
      tags: [Auth]
      summary: Staff sign-in with email and password
      description: |
        **Role:** public. For `ORGANISER` and `ADMIN` accounts. The answer is one of two
        shapes; switch on `mfa_required`:

        - `mfa_required: false` - the user has no TOTP turned on. The answer is the full
          session (tokens and user); they are signed in.
        - `mfa_required: true` - the user has TOTP turned on. The answer carries a
          short-lived `mfa_token` that is only accepted by `POST /auth/totp/verify`. It is
          not a bearer token.

        Wrong email and wrong password give the same 401 so accounts cannot be listed.
        Rate limited per email and per IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordLogin' }
            example: { email: organiser@talanta.test, password: correct-horse-battery }
      responses:
        '200':
          description: Signed in, or a TOTP code is now needed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
              examples:
                signedIn:
                  summary: No TOTP - signed in
                  value:
                    mfa_required: false
                    access_token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI3In0.c2ln
                    token_type: Bearer
                    expires_in_seconds: 900
                    refresh_token: rt_5Jq0m1Zb2Xc3Vd4Ne5Mf6Lg7Kh8Ji9
                    refresh_expires_at: '2026-11-10T09:00:00Z'
                    user:
                      id: 7
                      phone: null
                      email: organiser@talanta.test
                      name: Wanjiru Kamau
                      role: ORGANISER
                      totp_enabled: false
                      created_at: '2026-10-01T08:00:00Z'
                mfaRequired:
                  summary: TOTP is on - second step needed
                  value: { mfa_required: true, mfa_token: 'eyJhbGciOiJIUzI1NiJ9.e30.mfa', expires_in_seconds: 300 }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`INVALID_CREDENTIALS`.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /auth/totp/verify:
    post:
      operationId: verifyTotp
      tags: [Auth]
      summary: Second step of staff sign-in - TOTP code
      description: |
        **Role:** public (needs the `mfa_token` from `POST /auth/login`). Only used when
        that answer had `mfa_required: true`. The `mfa_token` is single-use on success and
        dies after 5 wrong codes. Rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpVerify' }
            example: { mfa_token: 'eyJhbGciOiJIUzI1NiJ9.e30.mfa', code: '123456' }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`MFA_TOKEN_INVALID` (expired, used or malformed - start again at `/auth/login`) or `TOTP_INVALID` (wrong code, may retry).'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /auth/refresh:
    post:
      operationId: refreshTokens
      tags: [Auth]
      summary: Swap a refresh token for a new pair
      description: |
        **Role:** public (needs a refresh token). Refresh tokens rotate: each one works
        once and the answer carries its replacement. Presenting a token that was already
        used is treated as theft: every token from that sign-in is revoked and the answer
        is 401 `REFRESH_TOKEN_REUSED`. On either 401 the client must sign in again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New access and refresh tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`REFRESH_TOKEN_INVALID` (unknown, expired or revoked) or `REFRESH_TOKEN_REUSED`.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke a refresh token and its whole chain
      description: |
        **Role:** public (needs a refresh token; no access token required so an expired
        session can still sign out). Always 204, including for an unknown token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204':
          description: Signed out.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '500': { $ref: '#/components/responses/Internal' }

  /auth/invitations/{token}:
    get:
      operationId: getInvitation
      tags: [Auth]
      summary: Who an invitation is for
      description: |
        **Role:** public (the token is the secret). Lets the set-password page show the
        email and role before the invitee types anything. Rate limited per IP.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: The invitation is pending and can be accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
              example: { email: new.organiser@talanta.test, role: ORGANISER, expires_at: '2026-10-18T09:00:00Z' }
        '404':
          description: '`INVITATION_INVALID` - unknown token, or the invitation was revoked or already accepted.'
          content: *err
        '410':
          description: '`INVITATION_EXPIRED` - ask an admin to resend it.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /auth/invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [Auth]
      summary: Accept an invitation, set a password and sign in
      description: |
        **Role:** public (the token is the secret). Creates the staff account with the
        invitation's email and role, marks the invitation `ACCEPTED` and signs the new user
        in. The token works once. Rate limited per IP.
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitation' }
            example: { name: Wanjiru Kamau, password: a-long-pass-phrase }
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '404':
          description: '`INVITATION_INVALID`.'
          content: *err
        '409':
          description: '`EMAIL_ALREADY_REGISTERED` - an account with this email was created since the invitation was sent.'
          content: *err
        '410':
          description: '`INVITATION_EXPIRED`.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Me
  # ---------------------------------------------------------------------------
  /me:
    get:
      operationId: getMe
      tags: [Me]
      summary: The signed-in user
      description: '**Role:** any signed-in user.'
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }
    patch:
      operationId: updateMe
      tags: [Me]
      summary: Change the signed-in user's name
      description: '**Role:** any signed-in user. The name is printed on tickets issued afterwards.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMe' }
            example: { name: Achieng Odhiambo }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/Internal' }

  /me/password:
    post:
      operationId: changePassword
      tags: [Me]
      summary: Change the caller's password
      description: |
        **Role:** ORGANISER, ADMIN. Every other session of the user is signed out (their
        refresh tokens are revoked); the calling session stays. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePassword' }
      responses:
        '204':
          description: Password changed.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: '`PASSWORD_INCORRECT` - `current_password` is wrong.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /me/totp/setup:
    post:
      operationId: setupTotp
      tags: [Me]
      summary: Start turning on TOTP - get a secret to scan
      description: |
        **Role:** ORGANISER, ADMIN. No request body. Makes a new secret and returns it once,
        with an `otpauth://` URL to draw as a QR code. TOTP is **not** on yet: it turns on
        when `POST /me/totp/enable` proves the authenticator works. Calling setup again
        before enabling replaces the secret.
      responses:
        '200':
          description: The secret to add to an authenticator app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetup' }
              example:
                secret: JBSWY3DPEHPK3PXP
                otpauth_url: 'otpauth://totp/Talanta%20Tickets:organiser%40talanta.test?secret=JBSWY3DPEHPK3PXP&issuer=Talanta%20Tickets'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`TOTP_ALREADY_ENABLED` - turn it off first to change authenticator.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /me/totp/enable:
    post:
      operationId: enableTotp
      tags: [Me]
      summary: Turn on TOTP by proving a code
      description: |
        **Role:** ORGANISER, ADMIN. From the next sign-in, `POST /auth/login` answers
        `mfa_required: true` for this user. Rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TotpCode' }
            example: { code: '123456' }
      responses:
        '200':
          description: 'TOTP is on. The user, with `totp_enabled: true`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`TOTP_ALREADY_ENABLED`, or `TOTP_SETUP_REQUIRED` when `POST /me/totp/setup` was not called first.'
          content: *err
        '422':
          description: '`TOTP_CODE_INCORRECT` - the code does not match the secret; may retry.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /me/totp/disable:
    post:
      operationId: disableTotp
      tags: [Me]
      summary: Turn off TOTP
      description: '**Role:** ORGANISER, ADMIN. Needs the password again. The stored secret is deleted. Rate limited.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirm' }
      responses:
        '200':
          description: 'TOTP is off. The user, with `totp_enabled: false`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: '`TOTP_NOT_ENABLED`.'
          content: *err
        '422':
          description: '`PASSWORD_INCORRECT`.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /me/holds:
    get:
      operationId: listMyHolds
      tags: [Me]
      summary: The caller's active holds
      description: |
        **Role:** FAN. Only `ACTIVE`, unexpired holds, newest first. Not paged: the ticket limit keeps it
        to a handful. Lets the app find a hold again after a restart, to resume checkout or
        release the seats.
      parameters:
        - name: event_id
          in: query
          description: Only holds for this event.
          schema: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: Active holds, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HoldList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /me/bookings:
    get:
      operationId: listMyBookings
      tags: [Me]
      summary: The caller's bookings
      description: '**Role:** FAN. Newest first.'
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/BookingStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of bookings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /me/tickets:
    get:
      operationId: listMyTickets
      tags: [Me]
      summary: The caller's tickets
      description: |
        **Role:** FAN. Ordered by event kickoff, soonest first, then seat. Every ticket
        carries all that is needed to show it with no network, including `qr_token`.
        The app stores this answer on the phone.
      parameters:
        - name: event_id
          in: query
          schema: { $ref: '#/components/schemas/Id' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TicketStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of tickets.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Events (public read)
  # ---------------------------------------------------------------------------
  /events:
    get:
      operationId: listEvents
      tags: [Events]
      summary: Upcoming events
      description: |
        **Role:** public. Only `PUBLISHED`, `ON_SALE` and `SOLD_OUT` events are listed,
        ordered by kickoff, soonest first. `from` defaults to now.

        `status` here and everywhere an event is returned is the status the event has at
        the moment of the request: a published event is `ON_SALE` exactly while now is
        inside `[sales_open_at, sales_close_at)` and `PUBLISHED` outside it. The `status`
        filter matches on that same value.

        `seats_available` and `price_from_cents` in this list may be up to 20 seconds old.
        `GET /events/{eventId}` and the seat map lag by a few seconds at most.
      security: []
      parameters:
        - name: from
          in: query
          description: Kickoff at or after this time.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          description: Kickoff before this time.
          schema: { type: string, format: date-time }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PublicEventStatus' }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventPage' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`UNAUTHENTICATED` or `TOKEN_EXPIRED` - only when the request carries an `Authorization` header that is malformed, not a valid access token, or expired. No header is needed: leave it out and the call is anonymous.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /events/{eventId}:
    get:
      operationId: getEvent
      tags: [Events]
      summary: One event
      description: |
        **Role:** public. `DRAFT` events answer 404. `CANCELLED` and `COMPLETED` events are
        still returned here so a ticket holder's deep link keeps working.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`UNAUTHENTICATED` or `TOKEN_EXPIRED` - only when the request carries an `Authorization` header that is malformed, not a valid access token, or expired. No header is needed: leave it out and the call is anonymous.'
          content: *err
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /events/{eventId}/categories:
    get:
      operationId: listEventCategories
      tags: [Events]
      summary: Ticket categories and prices for an event
      description: '**Role:** public. Cheapest first. Not paged (an event has a handful). `DRAFT` events answer 404.'
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The categories.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`UNAUTHENTICATED` or `TOKEN_EXPIRED` - only when the request carries an `Authorization` header that is malformed, not a valid access token, or expired. No header is needed: leave it out and the call is anonymous.'
          content: *err
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Seat map
  # ---------------------------------------------------------------------------
  /events/{eventId}/map:
    get:
      operationId: getEventMap
      tags: [SeatMap]
      summary: Level 1 - the stadium, one polygon per stand
      description: |
        **Role:** public. About 8 stands, target size 4 KB. `price_from_cents` is the
        cheapest seat that is `AVAILABLE` right now in that stand, or null when none is.
        Counts may lag by a few seconds. `DRAFT` events answer 404.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The stadium overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StadiumMap' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`UNAUTHENTICATED` or `TOKEN_EXPIRED` - only when the request carries an `Authorization` header that is malformed, not a valid access token, or expired. No header is needed: leave it out and the call is anonymous.'
          content: *err
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /events/{eventId}/stands/{standId}/blocks:
    get:
      operationId: listStandBlocks
      tags: [SeatMap]
      summary: Level 2 - the blocks of one stand
      description: |
        **Role:** public. 10 to 20 blocks, target size 10 KB. Each block has its outline,
        seat total, available count and a price badge. The category table is sent once and
        blocks point into it by `category_id`.
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/StandId'
      responses:
        '200':
          description: The stand and its blocks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandBlocks' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401':
          description: '`UNAUTHENTICATED` or `TOKEN_EXPIRED` - only when the request carries an `Authorization` header that is malformed, not a valid access token, or expired. No header is needed: leave it out and the call is anonymous.'
          content: *err
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /events/{eventId}/blocks/{blockId}/seats:
    get:
      operationId: getBlockSeats
      tags: [SeatMap]
      summary: Level 3 - the seats of one block, or what changed since a marker
      description: |
        **Role:** public; the bearer token is optional. With a FAN token, seats the caller
        holds come back as `M` (held by you) instead of `H`. Who else holds a seat is never
        exposed.

        **Without `since`** the answer is the full block (`kind: "full"`): block geometry,
        the category table (sent once) and rows of seat tuples. No per-seat object keys.

        **With `since=<marker>`** the answer is `kind: "delta"`: only
        `[event_seat_id, status_code]` pairs for seats whose status changed after the
        marker, plus a new marker. An empty `changes` array is the normal answer. The app
        polls this every `poll_interval_seconds` while the block is on screen.

        If the marker is unreadable, too old, or anything other than status changed (for
        example a price), the server answers `kind: "full"` instead; the client replaces
        its cached block. Always switch on `kind`.

        The marker is an opaque string that only the server can read; clients must not
        parse it, and a marker is only good for the event and block it was issued for. A
        delta may repeat a seat the client was already told about (the server looks back a
        little before the marker so that no change is ever missed); a change is the seat's
        status now, so applying it twice is harmless. A marker older than five minutes is
        answered with the full block.

        A hold that has lapsed but not yet been swept is reported as `A`, and a seat whose
        hold lapses while the block is open comes back as `A` in the next delta.

        `since` must be 1 to 128 characters, otherwise 400. A marker of the right size that
        the server cannot read is not an error: it gets `kind: "full"`.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - $ref: '#/components/parameters/BlockId'
        - name: since
          in: query
          description: The `marker` from the previous answer for this block.
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: The full block, or the changes since the marker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockSeats' }
              examples:
                full:
                  summary: Full block (no `since`)
                  value:
                    kind: full
                    marker: 'MTc2MDE3NjgwMDEyMzQ1Ng'
                    poll_interval_seconds: 5
                    block:
                      id: 112
                      stand_id: 3
                      code: N12
                      label: North 12
                      rotation_deg: 180
                      seat_pitch_x: 5
                      seat_pitch_y: 8
                      bounds: { min_x: 4010, min_y: 590, max_x: 4025, max_y: 606 }
                    categories:
                      - { id: 7, name: Regular, price_cents: 50000, color_hex: '#2E7D32' }
                      - { id: 8, name: VIP, price_cents: 250000, color_hex: '#C9A227' }
                    rows:
                      - label: A
                        seats:
                          - [910001, 1, 4012.5, 594, 0, 1, A]
                          - [910002, 2, 4017.5, 594, 1, 1, M]
                          - [910003, 3, 4022.5, 594, 2, 1, H]
                      - label: B
                        seats:
                          - [910004, 1, 4012.5, 602, 0, 0, S]
                          - [910005, 2, 4017.5, 602, 3, 0, A]
                          - [910006, 3, 4022.5, 602, 0, -1, B]
                delta:
                  summary: Changes only (`since` given)
                  value:
                    kind: delta
                    marker: 'MTc2MDE3NjgwNTk4NzY1NA'
                    poll_interval_seconds: 5
                    changes:
                      - [910001, H]
                      - [910004, A]
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Holds
  # ---------------------------------------------------------------------------
  /holds:
    post:
      operationId: createHold
      tags: [Holds]
      summary: Hold specific seats for 10 minutes
      description: |
        **Role:** FAN. All or nothing: if any requested seat is not free, none is held and
        the answer is 409 `SEATS_UNAVAILABLE` with `details.unavailable_seat_ids`. A seat ID
        that does not belong to the event is reported the same way.

        `seat_ids` are **event seat IDs** (position 0 of the level-3 seat tuple), not
        physical seat IDs.

        The per-user limit counts seats in the caller's active holds plus seats in their
        paid bookings for the event (and seats of a booking whose payment is still in
        progress). A fan who wants different seats releases the old hold first.

        Rate limited per user and per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHold' }
            example: { event_id: 1, seat_ids: [910001, 910005] }
      responses:
        '201':
          description: All requested seats are held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` - no such event (a `DRAFT` event counts as missing).'
          content: *err
        '409':
          description: |
            - `SEATS_UNAVAILABLE` - one or more seats are held, sold or blocked. Nothing was held.
            - `EVENT_NOT_ON_SALE` - the event is not in status `ON_SALE`.
            - `SALES_NOT_OPEN` - before `sales_open_at`.
            - `SALES_CLOSED` - after `sales_close_at`.
            - `EVENT_BUSY` - the organiser is changing the event right now (publishing, cancelling or editing it) and it stayed locked for more than about 3 seconds. Nothing was held; ask again in a moment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                seatsUnavailable:
                  summary: One of two seats was taken
                  value:
                    error:
                      code: SEATS_UNAVAILABLE
                      message: 1 of the 2 seats you chose is no longer available.
                      details: { unavailable_seat_ids: [910005] }
                salesClosed:
                  summary: Sales window is over
                  value:
                    error:
                      code: SALES_CLOSED
                      message: Ticket sales for this event have closed.
                      details:
                        event_status: ON_SALE
                        sales_open_at: '2026-10-01T06:00:00Z'
                        sales_close_at: '2026-10-18T12:00:00Z'
        '422':
          description: '`TICKET_LIMIT_EXCEEDED` - this hold would take the caller past `max_tickets_per_user`.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: TICKET_LIMIT_EXCEEDED
                  message: You can buy up to 6 tickets for this event. You have 2 left.
                  details: { allowed: 6, held_or_bought: 4, requested: 3, remaining: 2 }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /holds/best-available:
    post:
      operationId: createBestAvailableHold
      tags: [Holds]
      summary: Hold the best run of neighbouring seats in a category
      description: |
        **Role:** FAN. The server finds `quantity` neighbouring seats in one row of the
        category and holds them, trying a few runs if others get there first. A group is
        never split across a gap or an aisle. The answer has the same shape as
        `POST /holds`; the app shows the seats on the map using `block_id`.

        Only `STANDARD` seats are handed out, unless the category has no run of them at
        all: then a run may include `RESTRICTED_VIEW` seats. `ACCESSIBLE` and `COMPANION`
        seats are never handed out here; they are picked on the map.

        409 `NO_ADJACENT_SEATS` means no run was found or every attempt lost a race;
        asking again, or for fewer seats, may succeed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBestAvailableHold' }
            example: { event_id: 1, category_id: 7, quantity: 4 }
      responses:
        '201':
          description: A run of neighbouring seats is held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` - no such event, or the category is not part of it.'
          content: *err
        '409':
          description: '`NO_ADJACENT_SEATS`, `EVENT_NOT_ON_SALE`, `SALES_NOT_OPEN`, `SALES_CLOSED`, or `EVENT_BUSY` (the organiser is changing the event right now; nothing was held, ask again in a moment).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: NO_ADJACENT_SEATS
                  message: We could not find 4 seats together in Regular.
                  details: { category_id: 7, quantity: 4, available: 3 }
        '422':
          description: '`TICKET_LIMIT_EXCEEDED`.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /holds/{holdId}:
    get:
      operationId: getHold
      tags: [Holds]
      summary: One hold, with its expiry
      description: |
        **Role:** FAN, owner only. Returned in every status, so the app can tell
        `EXPIRED` from `RELEASED`. The countdown is computed from `expires_at`;
        `remaining_seconds` is the server's view at answer time and is there to correct for
        a wrong phone clock.
      parameters:
        - $ref: '#/components/parameters/HoldId'
      responses:
        '200':
          description: The hold.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hold' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      operationId: releaseHold
      tags: [Holds]
      summary: Give the seats back
      description: |
        **Role:** FAN, owner only. Frees the seats now. If the hold has an unpaid booking,
        that booking becomes `CANCELLED`. Safe to repeat: a hold that is already `RELEASED`
        or `EXPIRED` answers 204.
      parameters:
        - $ref: '#/components/parameters/HoldId'
      responses:
        '204':
          description: Released (or already was).
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `PAYMENT_IN_PROGRESS` - an M-Pesa prompt is live for this hold's booking; wait for it to finish.
            - `HOLD_NOT_ACTIVE` - the hold is `CONVERTED` (the seats were bought).
            - `EVENT_BUSY` - the organiser is changing the event right now and it stayed locked for more than about 3 seconds. Nothing changed; ask again in a moment. (If the event is being cancelled, the cancel releases the hold itself.)
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Bookings
  # ---------------------------------------------------------------------------
  /bookings:
    post:
      operationId: createBooking
      tags: [Bookings]
      summary: Turn a hold into a booking awaiting payment
      description: |
        **Role:** FAN. The hold must be the caller's, `ACTIVE` and unexpired. Prices are
        copied onto the booking here and never change afterwards.

        `Idempotency-Key` is required. The app makes one key per checkout. Sending the same
        key again returns the same booking with **200** instead of 201 and creates nothing,
        also after the hold has ended. One hold has at most one live booking: a second key
        for the same hold answers `HOLD_ALREADY_BOOKED`, however close together the two
        requests arrive.

        `fee_cents` is `BOOKING_FEE_BPS` basis points of the subtotal rounded to the nearest
        whole shilling (a multiple of 100 cents; half a shilling rounds up), the same sum
        the hold showed as an estimate. M-Pesa takes whole shillings only, so a fee with a
        fraction of a shilling would make the booking unpayable. `reference` is `TLT-` and six characters from
        `ABCDEFGHJKMNPQRSTUVWXYZ23456789` (no 0, O, 1, I or L).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBooking' }
            example: { hold_id: 5521 }
      responses:
        '200':
          description: Replay - the booking this key already created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '201':
          description: Booking created in `PENDING_PAYMENT`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400':
          description: '`VALIDATION_FAILED`, or `IDEMPOTENCY_KEY_REQUIRED` when the header is missing or malformed.'
          content: *err
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` - no such hold, or it belongs to someone else.'
          content: *err
        '409':
          description: |
            - `HOLD_EXPIRED` - the 10 minutes ran out.
            - `HOLD_NOT_ACTIVE` - the hold was released or already paid for.
            - `HOLD_ALREADY_BOOKED` - the hold already has a booking made with a different key; `details.booking_reference` names it.
            - `EVENT_BUSY` - an organiser's publish, cancel or edit has the event locked; nothing was created, send the same request (same key) again.
          content: *err
        '422':
          description: '`IDEMPOTENCY_KEY_REUSED` - this key was already used for a different hold.'
          content: *err
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /bookings/{reference}:
    get:
      operationId: getBooking
      tags: [Bookings]
      summary: One booking by its reference
      description: |
        **Role:** FAN, owner only. This is what the app resumes from after being closed
        mid-payment: `status`, `latest_payment` and `hold_expires_at` say whether to show
        tickets, keep polling, offer a retry or go back to the map.
      parameters:
        - $ref: '#/components/parameters/BookingReference'
      responses:
        '200':
          description: The booking.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  # ---------------------------------------------------------------------------
  # Payments
  # ---------------------------------------------------------------------------
  /payments/mpesa/stk:
    post:
      operationId: startMpesaStkPush
      tags: [Payments]
      summary: Send an M-Pesa PIN prompt for a booking
      description: |
        **Role:** FAN, booking owner only. The amount is always the booking's
        `total_cents`; the client cannot set it. Answers 202: the outcome arrives later.
        Poll `GET /payments/{paymentId}` (about every 2 seconds) until `status` is final.

        Starting the first payment pushes the hold's expiry out once so at least 6 minutes
        remain; re-read the booking for the new `hold_expires_at`. After a failed payment
        the fan may retry for as long as the hold has at least 2 minutes left (a hold is
        extended only once, so a late retry can find too little: `HOLD_EXPIRED`).

        `phone` may be written the Kenyan ways (`07…`, `2547…`); it is stored and returned
        as E.164. Only Kenyan (`+254`) numbers are accepted.

        How a payment ends, as `GET /payments/{paymentId}` shows it:

        | What happened | `status` | `failure_reason` | `booking_status` |
        |---|---|---|---|
        | Paid, seats sold, tickets issued | `SUCCESS` | null | `PAID` |
        | Insufficient funds, wrong PIN, cancelled, prompt timed out | `FAILED` | that reason | `PENDING_PAYMENT` while the hold lives, else `EXPIRED` |
        | No answer from M-Pesa within 5 minutes | `TIMEOUT` | `timeout` | as above |
        | M-Pesa itself reports a different amount paid | `FAILED` | `wrong_amount` | `REFUND_REQUIRED` |
        | Paid, but the tickets could not be issued | `SUCCESS` | null | `REFUND_REQUIRED` |
        | Paid, but the seats were gone (hold ended and seats resold, event cancelled) | `SUCCESS` | null | `REFUND_REQUIRED` |
        | Paid a second time for a booking another payment already paid | `SUCCESS` | null | `PAID` (tickets kept; this payment is refunded) |

        `FAILED` and `TIMEOUT` are not always the last word: if M-Pesa later confirms that
        the money did arrive, the payment becomes `SUCCESS` and ends as one of the three
        "Paid" rows above. Keep showing what `GET /payments/{paymentId}` says.

        **When we cannot tell whether the request reached M-Pesa** (it timed out after it
        was sent, or the answer was lost) the answer is still **202** with the payment
        `PENDING`, and its `result_desc` says "We are checking with M-Pesa whether the
        request went through. Do not pay again yet." The fan may or may not get a prompt.
        Until that payment resolves, a second one for the booking is refused with 409
        `PAYMENT_IN_PROGRESS`, so the fan cannot pay twice. It resolves as any other payment
        does, or is closed as `TIMEOUT` after 5 minutes.

        **Dev only:** `X-Mock-Outcome` chooses what the mock provider does. Sending the
        header when `APP_ENV=production` is refused with 403 `MOCK_NOT_ALLOWED`. A value
        that is not one of the outcomes is 400 on `X-Mock-Outcome`. Without the header the
        mock succeeds, except for the phone numbers `+254700000101` to `+254700000108`,
        which play the outcomes in the order of the `MockOutcome` enum after `success`.
      parameters:
        - $ref: '#/components/parameters/MockOutcome'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartStkPush' }
            example: { booking_id: 8801, phone: '+254712345678' }
      responses:
        '202':
          description: |
            The payment is `PENDING`. Normally the prompt was sent. When `result_desc` is not
            null the request may not have reached M-Pesa and is being checked (see above).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: '`FORBIDDEN` (wrong role) or `MOCK_NOT_ALLOWED` (`X-Mock-Outcome` sent in production).'
          content: *err
        '404':
          description: '`NOT_FOUND` - no such booking, or it belongs to someone else.'
          content: *err
        '409':
          description: |
            - `BOOKING_NOT_PAYABLE` - the booking is not `PENDING_PAYMENT`; `details.booking_status` says what it is.
            - `HOLD_EXPIRED` - the seats are no longer held, or the hold has under 2 minutes left (then `details.hold_status` is still `ACTIVE`); start again from the map.
            - `PAYMENT_IN_PROGRESS` - a payment for this booking is still `INITIATED` or `PENDING`; `details.payment_id` names it.
            - `EVENT_BUSY` - an organiser's publish, cancel or edit has the event locked; nothing was started, send the request again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: PAYMENT_IN_PROGRESS
                  message: A payment for this booking is already waiting for your PIN.
                  details: { payment_id: 4410, payment_status: PENDING }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }
        '502':
          description: '`PAYMENT_PROVIDER_UNAVAILABLE` - the request provably did not reach M-Pesa, or M-Pesa refused it. The attempt is kept as a `FAILED` payment (the booking shows it as `latest_payment`); no payment is left live and the fan may retry at once. (A request that MAY have reached M-Pesa is not this: it is a 202.)'
          content: *err

  /payments/{paymentId}:
    get:
      operationId: getPayment
      tags: [Payments]
      summary: Payment status
      description: |
        **Role:** FAN, owner only. `failure_reason` is the stable value to switch on;
        `result_desc` is the provider's own wording. `booking_status` is included so one
        poll tells the app both that the money arrived and whether tickets were issued
        (`PAID`) or the seats were lost and a refund is owed (`REFUND_REQUIRED`). The table
        under `POST /payments/mpesa/stk` lists every combination.

        Stop polling when `status` is `SUCCESS`, `FAILED` or `TIMEOUT`. A `TIMEOUT` can still
        change afterwards, to `SUCCESS` or `FAILED`, if M-Pesa reports late; the booking
        (`GET /bookings/{reference}`) always shows the truth.
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '200':
          description: The payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Payment' }
              examples:
                wrongPin:
                  summary: Failed - wrong PIN
                  value:
                    id: 4410
                    booking_id: 8801
                    booking_reference: TLT-8H3K2M
                    booking_status: PENDING_PAYMENT
                    provider: MPESA
                    status: FAILED
                    amount_cents: 100000
                    currency: KES
                    phone: '+254712345678'
                    mpesa_receipt: null
                    failure_reason: wrong_pin
                    result_code: 2001
                    result_desc: The initiator information is invalid.
                    created_at: '2026-10-11T09:15:02Z'
                    completed_at: '2026-10-11T09:15:21Z'
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /webhooks/mpesa/callback:
    post:
      operationId: mpesaCallback
      tags: [Payments]
      summary: Daraja STK push result callback
      description: |
        **Role:** public; called by Safaricom, not by our clients. No bearer token: the
        source IP is checked against an allowlist from config.

        The body is never trusted alone: it is a hint to ask Daraja. The server finds the
        payment by `CheckoutRequestID` and, for a "paid", asks Daraja itself (the
        authenticated STK query) before anything is sold or queued for refund. Only
        Daraja's own answer moves money. The `Amount` in the body is never treated as
        money: Daraja's query names no amount and an STK prompt cannot be paid in part or
        in excess, so a confirmed payment is paid in full at the amount we requested, and
        a body naming a different amount only raises an `AMOUNT_MISMATCH` alert (no refund
        is queued for the body's figure). A failure is taken from the body when its
        `ResultCode` is a documented final failure; any other code is checked with Daraja.

        The callback is **written down before the answer is sent** (the callback inbox), so
        it survives a busy event, a failed query and a restart; the work itself runs after
        the answer and is retried by the worker until it is done. A success that arrives
        for a payment already `FAILED` or `TIMEOUT` is still applied.

        A "paid" whose `CheckoutRequestID` no payment has (the STK request reached M-Pesa
        but its answer never reached us) is stored too, raises a `PAYMENT_UNRESOLVED` alert
        naming the receipt and amount, and is matched to a payment with no M-Pesa ID by
        phone and amount once Daraja confirms it. An unknown ID with a failure, a repeat, a
        body that is not Daraja's, a `ResultCode` that does not fit 32 bits and a
        disallowed IP change nothing. When payments are switched off
        (`PAYMENT_PROVIDER=none`) every callback is ignored. The body is limited to 64 KiB.

        Answers 200 `{ "ResultCode": 0, "ResultDesc": "Accepted" }`, even for a body that
        cannot be parsed or comes from a disallowed address, so nothing is revealed to a
        prober. The one exception is **503**: a real callback that could not be written
        down (the database is unreachable) is not acknowledged as accepted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MpesaCallback' }
            examples:
              success:
                summary: Customer paid
                value:
                  Body:
                    stkCallback:
                      MerchantRequestID: 29115-34620561-1
                      CheckoutRequestID: ws_CO_191220191020363925
                      ResultCode: 0
                      ResultDesc: The service request is processed successfully.
                      CallbackMetadata:
                        Item:
                          - { Name: Amount, Value: 1000.00 }
                          - { Name: MpesaReceiptNumber, Value: NLJ7RT61SV }
                          - { Name: Balance }
                          - { Name: TransactionDate, Value: 20261011121530 }
                          - { Name: PhoneNumber, Value: 254712345678 }
              cancelled:
                summary: Customer cancelled the prompt (no metadata)
                value:
                  Body:
                    stkCallback:
                      MerchantRequestID: 29115-34620561-1
                      CheckoutRequestID: ws_CO_191220191020363925
                      ResultCode: 1032
                      ResultDesc: Request cancelled by user.
      responses:
        '200':
          description: Always, except as below.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpesaCallbackAck' }
              example: { ResultCode: 0, ResultDesc: Accepted }
        '503':
          description: The callback is a valid one from an allowed address and could not be stored. Nothing was accepted; send it again.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before sending it again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MpesaCallbackNotStored' }
              example: { ResultCode: 1, ResultDesc: Temporarily unavailable }

  # ---------------------------------------------------------------------------
  # Tickets
  # ---------------------------------------------------------------------------
  /tickets/{ticketId}:
    get:
      operationId: getTicket
      tags: [Tickets]
      summary: One ticket
      description: '**Role:** FAN, owner only.'
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /tickets/{ticketId}/qr:
    get:
      operationId: getTicketQr
      tags: [Tickets]
      summary: The ticket's QR code as a PNG
      description: |
        **Role:** FAN, owner only. The image encodes the same `TLT1.…` string as
        `qr_token`. The app normally draws the QR itself from `qr_token`; this endpoint is
        for sharing and printing. Errors are JSON. 60 requests a minute per user.
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - name: size
          in: query
          description: Width and height in pixels.
          schema: { type: integer, minimum: 128, maximum: 1024, default: 512 }
      responses:
        '200':
          description: PNG image.
          headers:
            Cache-Control:
              description: '`private, no-store` - a QR must not sit in a shared cache.'
              schema: { type: string }
          content:
            image/png:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/Internal' }

  /t/{webToken}:
    get:
      operationId: getWebTicket
      tags: [Tickets]
      summary: Web ticket page from the SMS link
      description: |
        **Role:** public. An HTML page showing every ticket of one booking with its QR, for
        fans without the app. The token is 64 random hex characters, unrelated to the
        booking reference; whoever has the link has the tickets. Sent `no-store` and
        `noindex`. Unknown tokens get an HTML 404, and so does the link of a booking that
        has no tickets (it was never paid). A ticket that is `VALID` is shown with its QR
        code; a `USED` or `VOID` one is shown as such, without a code. No access token is
        read: an `Authorization` header is ignored. Every answer of this page is HTML.
      security: []
      parameters:
        - name: webToken
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: The ticket page.
          content:
            text/html:
              schema: { type: string }
        '404':
          description: Unknown or malformed token. HTML, not the JSON error shape.
          content:
            text/html:
              schema: { type: string }
        '429':
          description: Too many requests from this IP. HTML, not the JSON error shape.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
          content:
            text/html:
              schema: { type: string }
        '500':
          description: Fault on our side. HTML, not the JSON error shape.
          content:
            text/html:
              schema: { type: string }

  # ---------------------------------------------------------------------------
  # Admin: venues and layout
  # ---------------------------------------------------------------------------
  /admin/venues:
    get:
      operationId: listVenues
      tags: [AdminVenues]
      summary: Venues
      description: '**Role:** ORGANISER, ADMIN. Not paged (one stadium today).'
      responses:
        '200':
          description: The venues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/venues/{venueId}:
    get:
      operationId: getVenue
      tags: [AdminVenues]
      summary: A venue's plan - stands and blocks, no seats
      description: |
        **Role:** ORGANISER, ADMIN. Everything the layout editor draws before a block is
        opened: stand polygons and each block's placement, outline and seat count.
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: The venue.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VenueDetail' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/venues/{venueId}/blocks:
    post:
      operationId: createBlock
      tags: [AdminVenues]
      summary: Place a new block on the plan
      description: |
        **Role:** ORGANISER, ADMIN. The block starts with no seats; call
        `generate-seats` next. `code` is unique within its stand.
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBlock' }
            example:
              stand_id: 3
              code: N12
              label: North 12
              origin_x: 4012.5
              origin_y: 594
              rotation_deg: 180
              arc_radius: null
              seat_pitch_x: 5
              seat_pitch_y: 8
      responses:
        '201':
          description: The new block.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Block' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`NOT_FOUND` - no such venue, or the stand is not part of it.'
          content: *err
        '409':
          description: '`ALREADY_EXISTS` - the stand already has a block with this code (`details.fields` names `code`).'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/blocks/{blockId}:
    patch:
      operationId: updateBlock
      tags: [AdminVenues]
      summary: Move, rotate, curve or rename a block
      description: |
        **Role:** ORGANISER, ADMIN. Send only the fields to change. Changing placement
        recomputes the outline and every seat's `x`/`y`; seat IDs, rows and numbering stay,
        so existing inventory and tickets are not affected. A move that would take the
        block's outline outside the venue plan is 400 with rule `plan_bounds` on the
        placement fields that were sent.

        A move, a new label or a new curve goes through while an event at the venue is
        being published. A new `code` has to wait for the publish; if the wait passes
        about 3 seconds, or someone else is editing the same block, the answer is 409
        `EVENT_BUSY` and nothing changed.
      parameters:
        - $ref: '#/components/parameters/BlockId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBlock' }
      responses:
        '200':
          description: The updated block.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Block' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            - `ALREADY_EXISTS` - another block in the stand has this code.
            - `EVENT_BUSY` - an event at the venue is being published, or the block is being changed by someone else. Nothing changed; try again in a moment.
          content: *err
        '500': { $ref: '#/components/responses/Internal' }
    delete:
      operationId: deleteBlock
      tags: [AdminVenues]
      summary: Remove a block and its seats
      description: |
        **Role:** ORGANISER, ADMIN. Refused if any event has inventory for the block
        (that is, any event was published with it), and while an event at the venue is in
        the middle of being published.
      parameters:
        - $ref: '#/components/parameters/BlockId'
      responses:
        '204':
          description: Deleted.
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`BLOCK_HAS_INVENTORY` - `details.event_ids` lists the events using it. It is empty when the refusal is because an event at the venue is being published right now; try again in a minute.'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/blocks/{blockId}/generate-seats:
    post:
      operationId: generateBlockSeats
      tags: [AdminVenues]
      summary: Generate a block's rows and seats, or preview them
      description: |
        **Role:** ORGANISER, ADMIN. The server makes the rows and seats and computes each
        seat's position from the block's placement.

        With `dry_run: true` nothing is saved: the answer is the preview and row and seat
        IDs are null. With `dry_run: false` the block's existing rows and seats are
        **replaced** and the answer carries the new IDs. Replacing is refused once any
        event has inventory for the block.

        Limits: 200 rows, 500 seats per row, and 3,000 seats in the block
        (`rows` x `seats_per_row`; more is 400 with rule `max_seats` on both fields, for a
        preview too). The generated outline must stay inside the
        venue plan (`0..plan_width` by `0..plan_height`); if it does not, the answer is 400
        with rule `plan_bounds` on `rows` and `seats_per_row` and nothing is saved. A
        layout the geometry cannot make (for example a row too long for the block's
        `arc_radius`) is 400 with rule `layout`.
      parameters:
        - $ref: '#/components/parameters/BlockId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateSeats' }
            example:
              rows: 3
              seats_per_row: 4
              row_label_scheme: ALPHA
              numbering_direction: LTR
              row_offsets: [0, 0, 2.5]
              dry_run: true
      responses:
        '200':
          description: The generated layout (saved unless `dry_run`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockLayout' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`BLOCK_HAS_INVENTORY` - only when `dry_run` is false. `details.event_ids` is empty when an event at the venue is being published right now.'
          content: *err
        '500': { $ref: '#/components/responses/Internal' }

  /admin/blocks/{blockId}/seats:
    get:
      operationId: getBlockLayout
      tags: [AdminVenues]
      summary: A block's physical seats, for the editor
      description: |
        **Role:** ORGANISER, ADMIN. The saved rows and seats in the same compact shape as
        the `generate-seats` answer. Row IDs here are what `assign-category` takes in
        `row_ids`.
      parameters:
        - $ref: '#/components/parameters/BlockId'
      responses:
        '200':
          description: The block's layout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BlockLayout' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }

  /admin/venues/{venueId}/templates:
    get:
      operationId: listVenueTemplates
      tags: [AdminVenues]
      summary: Saved category-and-painting templates for a venue
      description: '**Role:** ORGANISER, ADMIN. Not paged.'
      parameters:
        - $ref: '#/components/parameters/VenueId'
      responses:
        '200':
          description: The templates.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateList' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
    post:
      operationId: createVenueTemplate
      tags: [AdminVenues]
      summary: Save an event's categories and painting as a named template
      description: |
        **Role:** ORGANISER, ADMIN. Copies the event's categories (name, colour, price,
