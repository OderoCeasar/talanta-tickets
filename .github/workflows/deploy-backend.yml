name: Deploy backend

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - "deploy/docker-compose.prod.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@v4
      # Sets up the docker-container buildx driver, required for the GHA build cache below.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ship the compose file and migrations to the server. The Caddy site block
      # (deploy/talanta.caddy) lives in the event-vendors-platform repo's Caddyfile, which owns
      # the shared Caddy, so it is intentionally not copied from here.
      - name: Copy deploy files + migrations to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          source: "deploy/docker-compose.prod.yml,backend/migrations"
          target: "/opt/talanta"
      - name: Pull image, run migrations, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/talanta
            # Layout: compose at ./docker-compose.prod.yml, migrations at ./migrations
            cp -f deploy/docker-compose.prod.yml docker-compose.prod.yml
            rm -rf migrations && mv backend/migrations migrations && rm -rf backend deploy
            # Log in to GHCR only if a read token is provided (skip if the package is public).
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi
            test -f .env || { echo "ERROR: /opt/talanta/.env is missing — create it from deploy/.env.example"; exit 1; }
            docker compose --env-file .env -f docker-compose.prod.yml pull
            docker compose --env-file .env -f docker-compose.prod.yml up -d
            docker image prune -f
