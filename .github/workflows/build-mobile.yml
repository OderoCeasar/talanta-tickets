name: Build mobile (EAS)

# Native builds run on Expo's cloud (EAS) and show up on expo.dev. Manual only: they are slow
# and consume EAS build minutes, so they do not run on every push.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "EAS build profile"
        type: choice
        # `preview` is an installable APK; `production` is the Play-ready .aab.
        # Both are defined in mobile/eas.json.
        options: [preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          # eas-cli's dependency tree needs Node >= 22 even though its own `engines` says >= 20.
          # If the "Installing eas-cli" step fails with an engine error, raise this number.
          node-version: 22
          cache: pnpm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - name: EAS build
        working-directory: mobile
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive --no-wait
