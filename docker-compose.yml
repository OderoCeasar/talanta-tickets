# Local development: Postgres + migrations + the API + the worker + Adminer.
# `make dev` starts all of it. Postgres is published on 5434 so it does not clash with other
# local databases on 5432.
x-backend-env: &backend-env
  APP_ENV: development
  DATABASE_URL: postgres://talanta:talanta@db:5432/talanta?sslmode=disable
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The api issues tickets when a callback arrives and the worker when it reconciles a
  # payment, so both must sign with the same key. This one is for local use only; it is not
  # a secret and must never be set on a real server.
  TICKET_SIGNING_KEY: "ANPnb0qYpmdUcWk2UDFJJZBZmbLGvra4cXlMZ41wkYU="
  TICKET_SIGNING_KEY_ID: k1
  PUBLIC_BASE_URL: http://localhost:8080
  # No money moves: the mock provider plays M-Pesa. X-Mock-Outcome picks what a payment does.
  PAYMENT_PROVIDER: mock

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talanta
      POSTGRES_PASSWORD: talanta
      POSTGRES_DB: talanta
    ports:
      # Loopback only: the dev password is public, so the database must not be on the LAN.
      - "127.0.0.1:5434:5432"
    volumes:
      - talanta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talanta -d talanta"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations, then exit. The api and worker wait for it to succeed.
  migrate:
    image: migrate/migrate:v4.17.1
    command: ["-path=/migrations", "-database", "postgres://talanta:talanta@db:5432/talanta?sslmode=disable", "up"]
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: &backend-build
      context: ./backend
      dockerfile: Dockerfile.dev
    # backend/.env is optional: it carries secrets for local runs (signing keys, Daraja).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
      ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Hold expiry sweeper and payment reconciliation. Same dev image as the api, different binary.
  worker:
    build: *backend-build
    entrypoint: ["worker"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Database browser at http://localhost:8081 (server: db, user/password/database: talanta).
  adminer:
    image: adminer:4
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db

volumes:
  talanta_pgdata:
